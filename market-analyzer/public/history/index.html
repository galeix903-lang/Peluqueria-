<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — Historial de análisis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .history-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .history-head__icon {
    width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--blue)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px -8px rgba(79, 70, 229, .45);
  }
  .history-head__icon svg { width: 22px; height: 22px; }

  .history-layout { display: grid; grid-template-columns: minmax(0, 360px) 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .history-layout { grid-template-columns: 1fr; } }

  .history-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .history-list-wrap { max-height: calc(100vh - 220px); overflow-y: auto; padding-right: 2px; }
  @media (max-width: 900px) { .history-list-wrap { max-height: none; } }

  .history-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; }
  .history-item__meta { color: var(--text-dim); font-size: .75rem; margin-top: 2px; }

  .history-detail-panel[hidden] { display: none; }
  /* .empty-state (shared/style.css) fija display:flex sin guardia para
     [hidden] — sin esto, emptyEl.hidden = true no ocultaba nada. */
  .empty-state[hidden] { display: none; }
  .history-back-link { display: none; align-items: center; gap: 4px; font-weight: 700; margin-bottom: 12px; }
  @media (max-width: 900px) {
    .history-back-link.is-visible { display: flex; }
    .history-layout.is-detail-open .history-list-panel { display: none; }
  }

  /* Reutiliza las mismas clases de escenarios/niveles que el Analyzer. */
  .levels-scale { position: relative; height: 34px; margin: 10px 0 6px; }
  .levels-scale__track { position: absolute; top: 15px; left: 0; right: 0; height: 4px; border-radius: 999px; background: linear-gradient(90deg, var(--red-bg), var(--field-bg), var(--green-bg)); }
  .levels-scale__mark { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .levels-scale__mark-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(20,22,43,.08); }
  .levels-scale__mark--support .levels-scale__mark-dot { background: var(--red); }
  .levels-scale__mark--resistance .levels-scale__mark-dot { background: var(--green); }
  .levels-scale__mark-label { font-size: .625rem; font-weight: 700; color: var(--text-dim); white-space: nowrap; margin-top: 18px; }
  .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 16px 0; }
  .result-grid .label { font-size: .75rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: .03em; }
  .result-grid .value { font-weight: 700; margin-top: 2px; }

  .view-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .view-tabs .chip { padding: 8px 16px; }

  .tr-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 720px) { .tr-summary { grid-template-columns: repeat(2, 1fr); } }
  .tr-stat { padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
  .tr-stat .value { font-size: 1.375rem; font-weight: 800; margin-top: 2px; }

  .tr-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 10px; }
  .tr-row__left { min-width: 0; }
  .tr-row__meta { color: var(--text-dim); font-size: .75rem; margin-top: 2px; }
  .tr-row__right { text-align: right; flex-shrink: 0; }
  .tr-row__change { font-weight: 700; font-size: .9375rem; }
  .tr-row--muted { opacity: .7; }
  .outcome-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 700; }
  .outcome-badge--favorable { background: var(--green-bg); color: var(--green); }
  .outcome-badge--unfavorable { background: var(--red-bg); color: var(--red); }
  .outcome-badge--invalidated { background: var(--red-bg); color: var(--red); }
  .outcome-badge--pending { background: var(--field-bg); color: var(--text-dim); }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/analysisCard.js"></script>
  <script>
    const SIGNAL_FILTERS = [
      { key: 'ALL', label: 'Todos' },
      { key: 'BUY', label: 'Sesgo alcista' },
      { key: 'SELL', label: 'Sesgo bajista' },
      { key: 'WAIT', label: 'Neutral' },
    ];

    mountShell({ page: 'history', title: 'Historial' }).then((ctx) => {
      if (!ctx) return;
      ctx.contentEl.innerHTML = `
        <div class="panel reveal" style="margin-bottom:20px;">
          <div class="history-head">
            <div class="history-head__icon">${vantexIcon('clock', { size: 22 })}</div>
            <div>
              <div class="text-h3">Historial de análisis</div>
              <div class="text-caption">Todos tus análisis pasados, cada uno con su sesgo, escenarios y niveles exactamente como se generaron — nunca se reescriben a posteriori.</div>
            </div>
          </div>
        </div>

        <div class="view-tabs">
          <button type="button" class="chip is-active" data-view-tab="history">Historial</button>
          <button type="button" class="chip" data-view-tab="track-record">Track Record</button>
        </div>

        <div data-view-history>
        <a href="#" class="history-back-link" data-back-link><span style="display:inline-flex; transform:rotate(180deg);">${vantexIcon('chevronRight', { size: 14 })}</span> Volver al listado</a>
        <div class="history-layout" data-history-layout>
          <div class="history-list-panel">
            <input type="text" class="symbol-input" data-search-input placeholder="Buscar por activo…" style="width:100%; margin-bottom:10px;" />
            <div class="history-filters" data-filters>
              ${SIGNAL_FILTERS.map((f, i) => `<button type="button" class="chip ${i === 0 ? 'is-active' : ''}" data-filter="${f.key}">${f.label}</button>`).join('')}
            </div>
            <div class="history-list-wrap"><div data-list></div></div>
          </div>
          <div class="panel history-detail-panel" data-detail hidden></div>
          <div class="panel empty-state" data-empty>
            <div class="empty-state__icon">${vantexIcon('inbox', { size: 28 })}</div>
            <div style="font-weight:700; margin-top:10px;">Selecciona un análisis para ver el detalle</div>
            <div class="text-caption" style="margin-top:4px;">O <a href="/analyzer">analiza tu primer gráfico</a> si todavía no tienes ninguno.</div>
          </div>
        </div>
        </div>

        <div data-view-track-record hidden>
          <div class="panel reveal" style="margin-bottom:20px;">
            <div class="text-h3">Track Record</div>
            <div class="text-caption" style="margin-top:4px;">Compara cada análisis con datos reales y sesgo direccional (alcista/bajista) con lo que ha hecho el precio desde entonces. Se registran todos, no solo los que salieron bien — así es como Vantex aprende contigo, no como se vende a sí mismo.</div>
          </div>
          <div data-tr-content></div>
        </div>
      `;

      const layoutEl = ctx.contentEl.querySelector('[data-history-layout]');
      const listEl = ctx.contentEl.querySelector('[data-list]');
      const detailEl = ctx.contentEl.querySelector('[data-detail]');
      const emptyEl = ctx.contentEl.querySelector('[data-empty]');
      const searchInput = ctx.contentEl.querySelector('[data-search-input]');
      const backLink = ctx.contentEl.querySelector('[data-back-link]');
      let allAnalyses = [];
      let activeFilter = 'ALL';
      let selectedId = null;

      function applyFilters() {
        const q = searchInput.value.trim().toUpperCase();
        return allAnalyses.filter((a) => {
          const matchesSignal = activeFilter === 'ALL' || a.signal === activeFilter;
          const matchesQuery = !q || (a.asset || '').toUpperCase().includes(q);
          return matchesSignal && matchesQuery;
        });
      }

      function showDetail(a) {
        selectedId = a.id;
        emptyEl.hidden = true;
        detailEl.hidden = false;
        renderAnalysisDetail(detailEl, a);
        backLink.classList.add('is-visible');
        layoutEl.classList.add('is-detail-open');
        detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      backLink.addEventListener('click', (e) => {
        e.preventDefault();
        layoutEl.classList.remove('is-detail-open');
      });

      function renderList() {
        const filtered = applyFilters();
        if (!filtered.length) {
          listEl.innerHTML = `<p class="text-caption" style="padding:12px 0;">${allAnalyses.length ? 'Ningún análisis coincide con este filtro.' : 'Todavía no has analizado ningún gráfico.'}</p>`;
          return;
        }
        renderAnalysisList(listEl, filtered, showDetail);
      }

      searchInput.addEventListener('input', renderList);
      ctx.contentEl.querySelectorAll('[data-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          ctx.contentEl.querySelectorAll('[data-filter]').forEach((b) => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          activeFilter = btn.dataset.filter;
          renderList();
        });
      });

      (async () => {
        const { analyses } = await api('/analyzer/history');
        allAnalyses = analyses;
        renderList();
        // Deep-link desde otra pantalla (p.ej. "Desde tu análisis" en
        // Paper Trading) a un análisis concreto por id — tiene prioridad
        // sobre el comportamiento por defecto de abrir el más reciente.
        const linkedId = new URLSearchParams(location.search).get('id');
        const linkedAnalysis = linkedId ? analyses.find((a) => a.id === linkedId) : null;
        if (linkedAnalysis) {
          history.replaceState(null, '', location.pathname);
          showDetail(linkedAnalysis);
        } else if (analyses.length && window.matchMedia('(min-width: 901px)').matches) {
          // En escritorio (hay sitio para lista + detalle a la vez) se abre
          // el más reciente directamente. En móvil la lista y el detalle
          // ocupan la misma columna, así que se deja el listado visible y
          // es el usuario quien elige qué análisis abrir.
          showDetail(analyses[0]);
        }
      })();

      // ---------- Track Record ----------
      const viewHistoryEl = ctx.contentEl.querySelector('[data-view-history]');
      const viewTrEl = ctx.contentEl.querySelector('[data-view-track-record]');
      const trContentEl = ctx.contentEl.querySelector('[data-tr-content]');
      let trLoaded = false;

      const OUTCOME_META = {
        FAVORABLE: { label: 'A favor del sesgo', cls: 'favorable' },
        UNFAVORABLE: { label: 'En contra del sesgo', cls: 'unfavorable' },
        INVALIDATED: { label: 'Invalidado', cls: 'invalidated' },
        PENDING: { label: 'Pendiente', cls: 'pending' },
        FLAT: { label: 'Sin cambio', cls: 'pending' },
      };
      const NOT_EVALUABLE_REASON = {
        VISUAL_SOURCE: 'Lectura visual de imagen — sin precio de mercado real que verificar.',
        NO_DIRECTIONAL_CALL: 'Sesgo neutral — no hubo una dirección que comparar con el precio.',
        PRICING_UNAVAILABLE: 'Los precios en vivo no están disponibles ahora mismo — no se puede verificar.',
        MISSING_DATA: 'Faltan datos de este análisis para poder verificarlo.',
      };

      ctx.contentEl.querySelectorAll('[data-view-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          ctx.contentEl.querySelectorAll('[data-view-tab]').forEach((b) => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          const isHistory = btn.dataset.viewTab === 'history';
          viewHistoryEl.hidden = !isHistory;
          viewTrEl.hidden = isHistory;
          if (!isHistory && !trLoaded) loadTrackRecord();
        });
      });

      async function loadTrackRecord() {
        trLoaded = true;
        trContentEl.innerHTML = `<p class="text-caption">Calculando…</p>`;
        try {
          const { results, summary, isSimulatedPricing } = await api('/analyzer/track-record');
          renderTrackRecord(results, summary, isSimulatedPricing);
        } catch (err) {
          trContentEl.innerHTML = `<p class="error-msg">${escapeHtml(err.message)}</p>`;
        }
      }

      function renderTrackRecord(results, summary, isSimulatedPricing) {
        if (!results.length) {
          trContentEl.innerHTML = `
            <div class="panel empty-state">
              <div class="empty-state__icon">${vantexIcon('inbox', { size: 28 })}</div>
              <div style="font-weight:700; margin-top:10px;">Todavía no hay análisis que evaluar</div>
              <div class="text-caption" style="margin-top:4px;"><a href="/analyzer">Analiza tu primer gráfico</a> para empezar a construir tu track record.</div>
            </div>
          `;
          return;
        }

        const simBanner = isSimulatedPricing ? `
          <div class="source-note source-note--visual" style="margin-bottom:18px;">
            ${vantexIcon('alertTriangle', { size: 15 })}
            <span>Los precios en vivo no están disponibles ahora mismo (modo simulado) — ningún análisis con datos reales se puede verificar hasta que vuelvan.</span>
          </div>
        ` : '';

        const summaryHtml = `
          <div class="tr-summary">
            <div class="tr-stat"><div class="text-meta">Evaluables</div><div class="value">${summary.evaluable}</div></div>
            <div class="tr-stat"><div class="text-meta">A favor</div><div class="value" style="color:var(--green);">${summary.favorable}</div></div>
            <div class="tr-stat"><div class="text-meta">En contra</div><div class="value" style="color:var(--red);">${summary.unfavorable}</div></div>
            <div class="tr-stat"><div class="text-meta">Invalidados</div><div class="value" style="color:var(--red);">${summary.invalidated}</div></div>
          </div>
        `;

        const rows = results.map((r) => {
          const dateTxt = new Date(r.createdAt).toLocaleDateString('es-ES');
          if (!r.evaluable) {
            return `
              <div class="tr-row tr-row--muted">
                <div class="tr-row__left">
                  <strong>${escapeHtml(r.asset)}</strong> <span class="text-caption">· ${dateTxt}</span>
                  <div class="tr-row__meta">${NOT_EVALUABLE_REASON[r.reason] || 'No evaluable.'}</div>
                </div>
              </div>
            `;
          }
          const meta = OUTCOME_META[r.outcome] || OUTCOME_META.PENDING;
          const changeTxt = `${r.changePct >= 0 ? '+' : ''}${r.changePct.toFixed(2)}%`;
          return `
            <div class="tr-row">
              <div class="tr-row__left">
                <strong>${escapeHtml(r.asset)}</strong>
                <span class="badge badge--${r.signal.toLowerCase()}" style="margin-left:6px;">${r.signal === 'BUY' ? 'Sesgo alcista' : 'Sesgo bajista'}</span>
                <div class="tr-row__meta">${dateTxt} · $${r.priceThen.toLocaleString('es-ES', { maximumFractionDigits: 2 })} → $${r.priceNow.toLocaleString('es-ES', { maximumFractionDigits: 2 })}</div>
              </div>
              <div class="tr-row__right">
                <div class="tr-row__change" style="color:${r.changePct >= 0 ? 'var(--green)' : 'var(--red)'};">${changeTxt}</div>
                <span class="outcome-badge outcome-badge--${meta.cls}">${meta.label}</span>
              </div>
            </div>
          `;
        }).join('');

        trContentEl.innerHTML = `${simBanner}${summaryHtml}${rows}`;
      }
    });
  </script>
</body>
</html>
