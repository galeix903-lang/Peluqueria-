<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cryptolyzer — AI Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .analyzer-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .analyzer-head__icon {
    width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--blue)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px -8px rgba(79, 70, 229, .45);
  }
  .analyzer-head__icon svg { width: 22px; height: 22px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--field-bg); color: var(--text-dim);
    padding: 7px 14px; border-radius: 999px; font-size: .8125rem; font-weight: 600;
    transition: border-color .15s, color .15s, background .15s, transform .12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.is-active { background: linear-gradient(135deg, var(--accent), var(--blue)); border-color: var(--accent); color: #fff; box-shadow: 0 6px 14px -6px rgba(37, 99, 235, .5); }
  .chip:active { transform: scale(.95); }
  .chip--asset { display: inline-flex; align-items: center; gap: 6px; }
  .chip--asset[hidden] { display: none; }
  .chip--asset .crypto-icon { margin: -2px 0; }

  .symbol-input {
    border: 1px solid var(--border); background: var(--field-bg); color: var(--text);
    padding: 7px 14px; border-radius: 999px; font-size: .8125rem; font-weight: 600;
    width: 220px; max-width: 100%;
  }
  .symbol-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .symbol-input::placeholder { color: var(--text-dim); font-weight: 500; }

  .symbol-field { position: relative; display: inline-block; max-width: 100%; }
  .symbol-search-results {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 20;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--relief-card-hover); padding: 6px; width: 270px; max-width: 80vw;
    max-height: 260px; overflow-y: auto;
  }
  .symbol-search-result {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 8px 9px; border-radius: 9px; font-size: .8125rem; transition: background .12s;
  }
  .symbol-search-result:hover, .symbol-search-result:focus-visible { background: var(--field-bg); }
  .symbol-search-result__logo {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    background: var(--field-bg);
  }
  .symbol-search-result__symbol { font-weight: 700; flex-shrink: 0; }
  .symbol-search-result__name { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .symbol-search-empty { padding: 10px 9px; font-size: .8125rem; color: var(--text-dim); }

  .dropzone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 40px 32px; text-align: center; cursor: pointer;
    background: var(--field-bg); transition: border-color .2s, transform .15s, background .2s;
  }
  .dropzone:hover { border-color: var(--accent); background: var(--accent-dim); }
  .dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-color: var(--accent); }
  .dropzone.is-dragover { border-color: var(--accent); transform: scale(1.01); background: var(--accent-dim); }
  .dropzone__icon {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%;
    background: var(--accent-dim); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s;
  }
  .dropzone:hover .dropzone__icon { transform: translateY(-3px) scale(1.05); }
  .dropzone img { max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 16px; animation: popIn .35s cubic-bezier(.34,1.56,.64,1); }

  /* Animación de procesamiento por pasos, sincronizada con la petición real. */
  .processing { display: none; flex-direction: column; gap: 10px; margin-top: 16px; }
  .processing.is-active { display: flex; }
  .processing__step { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: .875rem; font-weight: 600; opacity: .45; transition: opacity .25s, color .25s; }
  .processing__step.is-active { opacity: 1; color: var(--text); }
  .processing__step.is-done { opacity: 1; color: var(--green); }
  .processing__dot {
    width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--border); display: flex; align-items: center; justify-content: center;
    transition: border-color .25s, background .25s;
  }
  .processing__step.is-active .processing__dot { border-color: var(--accent); }
  .processing__step.is-active .processing__dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulseSoft 1s ease-in-out infinite; }
  .processing__step.is-done .processing__dot { border-color: var(--green); background: var(--green); }
  .processing__step.is-done .processing__dot svg { width: 11px; height: 11px; color: #fff; }

  .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 16px 0; }
  .result-grid .label { font-size: .75rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: .03em; }
  .result-grid .value { font-weight: 700; margin-top: 2px; }
  .confidence-bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 6px; }
  .confidence-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--blue)); width: 0; transition: width 1s cubic-bezier(.16,.84,.44,1); }

  /* Barra visual de soporte/resistencia sobre una escala simple. */
  .levels-scale { position: relative; height: 34px; margin: 10px 0 6px; }
  .levels-scale__track { position: absolute; top: 15px; left: 0; right: 0; height: 4px; border-radius: 999px; background: linear-gradient(90deg, var(--red-bg), var(--field-bg), var(--green-bg)); }
  .levels-scale__mark { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .levels-scale__mark-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(20,22,43,.08); }
  .levels-scale__mark--support .levels-scale__mark-dot { background: var(--red); }
  .levels-scale__mark--resistance .levels-scale__mark-dot { background: var(--green); }
  .levels-scale__mark-label { font-size: .625rem; font-weight: 700; color: var(--text-dim); white-space: nowrap; margin-top: 18px; }

  .history-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; }

  .empty-hint-panel { margin-bottom: 20px; display: flex; align-items: center; gap: 16px; }
  .empty-hint-panel[hidden] { display: none; }
  .history-item__meta { color: var(--text-dim); font-size: .75rem; margin-top: 2px; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/cryptoIcon.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script src="/shared/analysisCard.js"></script>
  <script>
    // Ejemplos deliberadamente mixtos (cripto, acción, fondo, forex) para que
    // quede claro que el analizador no está limitado a un solo tipo de activo.
    // Los marcados con ★ tienen datos de mercado reales (velas OHLCV) detrás:
    // para esos, la señal sale de un motor de cálculo determinista, no de que
    // la IA "opine" mirando la captura — ver server/services/analysisPipeline.js.
    // REAL_DATA_SYMBOLS, SIGNAL_META y el resto de etiquetas viven ahora en
    // shared/analysisCard.js (se comparten con la página de Historial).
    // Cada entrada lleva su categoría para el filtro Todas/Crypto/Memecoins
    // de abajo — no es una lista cerrada de activos admitidos (el campo de
    // texto y el buscador aceptan cualquier ticker), solo accesos rápidos
    // representativos de cada categoría.
    const SUPPORTED_SYMBOLS = [
      { symbol: 'BTC', category: 'crypto' },
      { symbol: 'ETH', category: 'crypto' },
      { symbol: 'SOL', category: 'crypto' },
      { symbol: 'DOGE', category: 'memecoin' },
      { symbol: 'SHIB', category: 'memecoin' },
      { symbol: 'PEPE', category: 'memecoin' },
      { symbol: 'WIF', category: 'memecoin' },
      { symbol: 'BONK', category: 'memecoin' },
      { symbol: 'AAPL', category: 'other' },
      { symbol: 'SPY', category: 'other' },
      { symbol: 'EUR/USD', category: 'other' },
    ];
    const ASSET_CATEGORIES = [
      { key: 'all', label: 'Todas' },
      { key: 'crypto', label: 'Crypto' },
      { key: 'memecoin', label: 'Memecoins' },
    ];
    const TIMEFRAMES = ['15m', '1H', '4H', '1D', '1W'];
    const STEPS = ['Leyendo gráfico…', 'Detectando patrones…', 'Generando análisis…'];
    const HISTORY_PREVIEW_COUNT = 5;

    // Bienvenida breve la primera vez que un usuario nuevo llega al
    // Analyzer (el núcleo del producto, no un tutorial largo) — los 4
    // pasos para sacarle valor: analizar, guardar, practicar, simular.
    // Se guarda por cuenta (no solo por navegador) para no repetirse en
    // sesiones siguientes del mismo usuario.
    function showOnboardingIfFirstVisit(user) {
      const key = `cryptolyzer_onboarding_seen_${user.id}`;
      if (localStorage.getItem(key)) return;
      const steps = [
        { icon: 'brain', title: 'Analiza cualquier gráfico', desc: 'Sube una captura aquí mismo y en segundos tendrás un sesgo claro (alcista/bajista/neutral), con sus escenarios y niveles clave.' },
        { icon: 'clock', title: 'Vuelve cuando quieras', desc: 'Cada análisis se guarda automáticamente en tu Historial, tal y como se generó — siempre puedes revisarlo más tarde.' },
        { icon: 'chartBar', title: 'Practica sin riesgo', desc: 'Empiezas con 100.000$ virtuales en Paper Trading para probar tus ideas sin arriesgar dinero real.' },
        { icon: 'windowLayout', title: 'De la idea a la práctica', desc: 'En cualquier análisis con datos reales, pulsa "Simular este escenario" para abrir esa idea directamente en tu ticket de Paper Trading.' },
      ];
      openModal({
        title: `Hola, ${user.name} — así funciona Cryptolyzer`,
        bodyHtml: `
          <div style="display:flex; flex-direction:column; gap:16px;">
            ${steps.map((s) => `
              <div style="display:flex; gap:12px; align-items:flex-start;">
                <div style="width:36px; height:36px; border-radius:10px; background:var(--accent-dim); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;">${vantexIcon(s.icon, { size: 17 })}</div>
                <div>
                  <div style="font-weight:700; font-size:.9375rem;">${s.title}</div>
                  <div class="text-caption" style="margin-top:2px; line-height:1.5;">${s.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `,
        footerHtml: `<button type="button" class="btn-primary" data-modal-close style="width:100%; justify-content:center;">Entendido, empezar</button>`,
        onClose: () => localStorage.setItem(key, '1'),
      });
    }

    mountShell({ page: 'analyzer', title: 'AI Analyzer' }).then((ctx) => {
      if (!ctx) return;
      showOnboardingIfFirstVisit(ctx.user);
      ctx.contentEl.innerHTML = `
        <div class="panel reveal" style="margin-bottom:20px;">
          <div class="analyzer-head">
            <div class="analyzer-head__icon">${vantexIcon('trendUp', { size: 22 })}</div>
            <div>
              <div class="text-h3">AI Market Analyzer 🤖</div>
              <div class="text-caption">Sube la captura de un gráfico y recibe una lectura técnica al instante.</div>
            </div>
          </div>

          <div style="display:flex; flex-wrap:wrap; gap:22px; margin-bottom:18px;">
            <div>
              <div class="text-meta" style="margin-bottom:8px;">Activo (opcional)</div>
              <div class="symbol-field">
                <input type="text" class="symbol-input" data-symbol-input placeholder="Buscar activo: cripto, memecoin, acción…" maxlength="20" autocomplete="off" />
                <div class="symbol-search-results" data-symbol-search-results hidden></div>
              </div>
              <div class="chip-row" data-category-chips style="margin-top:10px;">
                ${ASSET_CATEGORIES.map((c, i) => `<button type="button" class="chip ${i === 0 ? 'is-active' : ''}" data-category-filter="${c.key}">${c.label}</button>`).join('')}
              </div>
              <div class="chip-row" data-symbol-chips style="margin-top:8px;">
                ${SUPPORTED_SYMBOLS.map((s) => `<button type="button" class="chip chip--asset" data-symbol="${s.symbol}" data-asset-category="${s.category}" title="${REAL_DATA_SYMBOLS.includes(s.symbol) ? 'Datos de mercado reales' : 'Lectura visual de la imagen'}">${cryptoIconHtml(s.symbol, 15)}${s.symbol}${REAL_DATA_SYMBOLS.includes(s.symbol) ? ' ★' : ''}</button>`).join('')}
              </div>
              <div class="text-meta" style="margin-top:6px; color:var(--text-dim);">★ = señal calculada con datos de mercado reales, no solo lectura de la imagen</div>
            </div>
            <div>
              <div class="text-meta" style="margin-bottom:8px;">Temporalidad</div>
              <div class="chip-row" data-timeframe-chips>
                ${TIMEFRAMES.map((t, i) => `<button type="button" class="chip ${i === 3 ? 'is-active' : ''}" data-timeframe="${t}">${t}</button>`).join('')}
              </div>
            </div>
          </div>

          <div class="dropzone" data-dropzone tabindex="0" role="button" aria-label="Subir captura del gráfico: arrastra un archivo, haz clic, o pega una imagen copiada">
            <div class="dropzone__icon">${vantexIcon('upload', { size: 24 })}</div>
            <p style="margin:0; font-weight:700;">Arrastra una captura del gráfico aquí, haz clic, o pégala (Ctrl/Cmd+V)</p>
            <p style="margin:6px 0 0; color:var(--text-dim); font-size:.8125rem;">PNG o JPG, hasta 8 MB</p>
            <input type="file" accept="image/*" data-file-input hidden />
            <img data-preview hidden alt="Vista previa del gráfico subido" />
          </div>

          <div style="display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap;">
            <button class="btn-primary" data-analyze-btn disabled>${vantexIcon('bolt', { size: 16 })} Analizar gráfico</button>
            <span style="color:var(--text-dim); font-size:.8125rem;" data-quota></span>
          </div>

          <div class="processing" data-processing>
            ${STEPS.map((label, i) => `
              <div class="processing__step" data-step="${i}">
                <span class="processing__dot"></span>
                <span>${label}</span>
              </div>
            `).join('')}
          </div>

          <p class="error-msg" data-error aria-live="polite"></p>
          <div class="panel reveal-pop" data-upsell hidden style="margin-top:14px; background:var(--accent-dim); border-color:var(--accent);">
            <strong data-upsell-title>Has usado tus análisis de hoy.</strong>
            <p style="margin:6px 0 14px; color:var(--text-dim);" data-upsell-desc>Mejora tu plan para seguir analizando gráficos.</p>
            <button class="btn-primary" data-upsell-btn>Mejorar plan</button>
          </div>
        </div>

        <div class="panel" data-result hidden></div>
        <div class="panel reveal-pop empty-hint-panel" data-empty-hint>
          <div class="empty-state__icon" style="flex-shrink:0; margin:0;">${vantexIcon('inbox', { size: 24 })}</div>
          <div>
            <div style="font-weight:700;">Todavía no has analizado ningún gráfico</div>
            <div class="text-caption">Sube una captura arriba y en segundos tendrás tendencia, niveles clave y un sesgo claro.</div>
          </div>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; margin: 8px 0 12px;">
          <h2 class="text-h3" style="margin:0;">Historial reciente</h2>
          <a href="/history" class="text-caption" style="font-weight:700; display:flex; align-items:center; gap:4px;">Ver todo el historial ${vantexIcon('chevronRight', { size: 14 })}</a>
        </div>
        <div data-history></div>
      `;
      mountCryptoIcons(ctx.contentEl);

      const dropzone = ctx.contentEl.querySelector('[data-dropzone]');
      const fileInput = ctx.contentEl.querySelector('[data-file-input]');
      const preview = ctx.contentEl.querySelector('[data-preview]');
      const analyzeBtn = ctx.contentEl.querySelector('[data-analyze-btn]');
      const errorEl = ctx.contentEl.querySelector('[data-error]');
      const resultEl = ctx.contentEl.querySelector('[data-result]');
      const emptyHintEl = ctx.contentEl.querySelector('[data-empty-hint]');
      const historyEl = ctx.contentEl.querySelector('[data-history]');
      const quotaEl = ctx.contentEl.querySelector('[data-quota]');
      const upsellEl = ctx.contentEl.querySelector('[data-upsell]');
      const upsellBtn = ctx.contentEl.querySelector('[data-upsell-btn]');
      const processingEl = ctx.contentEl.querySelector('[data-processing]');
      let selectedFile = null;
      let quotaExhausted = false;
      let selectedTimeframe = '1D';
      const symbolInput = ctx.contentEl.querySelector('[data-symbol-input]');

      // El activo es texto libre (para admitir cualquier ticker: cripto,
      // acción, fondo, forex…); los chips son solo un atajo que rellena el
      // campo, no una lista cerrada de activos admitidos.
      // Delegado sobre el contenedor (no un listener por chip con
      // [data-symbol]): el icono interno de cada chip también lleva su
      // propio data-symbol (el que usa cryptoIcon.js para resolver el
      // logo), así que un listener por cada match disparaba dos veces al
      // clicar justo sobre el icono. data-asset-category identifica solo
      // al botón del chip, nunca a su icono interno.
      ctx.contentEl.querySelector('[data-symbol-chips]').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-asset-category]');
        if (!btn) return;
        const isSame = symbolInput.value.trim().toUpperCase() === btn.dataset.symbol.toUpperCase();
        symbolInput.value = isSame ? '' : btn.dataset.symbol;
        symbolInput.focus();
        syncSymbolChips();
      });
      function syncSymbolChips() {
        const current = symbolInput.value.trim().toUpperCase();
        ctx.contentEl.querySelectorAll('[data-symbol-chips] [data-asset-category]').forEach((b) => {
          b.classList.toggle('is-active', b.dataset.symbol.toUpperCase() === current);
        });
      }
      symbolInput.addEventListener('input', syncSymbolChips);

      // Filtro Todas/Crypto/Memecoins: solo oculta/muestra los chips de
      // acceso rápido — el campo de texto y el buscador siguen aceptando
      // cualquier símbolo sin importar el filtro activo.
      const categoryChipsEl = ctx.contentEl.querySelector('[data-category-chips]');
      function applyCategory(cat) {
        categoryChipsEl.querySelectorAll('[data-category-filter]').forEach((b) => {
          b.classList.toggle('is-active', b.dataset.categoryFilter === cat);
        });
        // Selector por data-asset-category (no por [data-symbol]): el
        // icono interno de cada chip también lleva su propio
        // data-symbol (el que usa cryptoIcon.js para resolver el logo),
        // así que [data-symbol] a secas matchearía dos elementos por
        // chip en vez de uno.
        ctx.contentEl.querySelectorAll('[data-symbol-chips] [data-asset-category]').forEach((b) => {
          b.hidden = cat !== 'all' && b.dataset.assetCategory !== cat;
        });
      }
      categoryChipsEl.querySelectorAll('[data-category-filter]').forEach((btn) => {
        btn.addEventListener('click', () => applyCategory(btn.dataset.categoryFilter));
      });

      // Buscador real de activos (incluidas memecoins): reutiliza
      // /api/market/search, el mismo endpoint que ya resuelve logos en
      // toda la app — sin inventar ni cachear resultados localmente, cada
      // tecleo consulta la fuente de datos real con un pequeño debounce.
      const searchResultsEl = ctx.contentEl.querySelector('[data-symbol-search-results]');
      let searchDebounceTimer = null;
      let searchRequestId = 0;
      function closeSearchResults() { searchResultsEl.hidden = true; searchResultsEl.innerHTML = ''; }
      async function runSymbolSearch(query) {
        const requestId = ++searchRequestId;
        try {
          const { results } = await api(`/market/search?q=${encodeURIComponent(query)}`);
          if (requestId !== searchRequestId) return; // respuesta obsoleta, el usuario ya siguió escribiendo
          if (!results.length) {
            searchResultsEl.innerHTML = `<div class="symbol-search-empty">Sin resultados para "${escapeHtml(query)}".</div>`;
            searchResultsEl.hidden = false;
            return;
          }
          searchResultsEl.innerHTML = results.map((r) => `
            <button type="button" class="symbol-search-result" data-search-pick="${escapeHtml(r.symbol)}">
              <img class="symbol-search-result__logo" src="${r.logo}" alt="" width="20" height="20" loading="lazy" onerror="this.style.visibility='hidden'" />
              <span class="symbol-search-result__symbol">${escapeHtml(r.symbol)}</span>
              <span class="symbol-search-result__name">${escapeHtml(r.name)}</span>
            </button>
          `).join('');
          searchResultsEl.hidden = false;
        } catch {
          closeSearchResults();
        }
      }
      symbolInput.addEventListener('input', () => {
        clearTimeout(searchDebounceTimer);
        const q = symbolInput.value.trim();
        if (q.length < 2) { closeSearchResults(); return; }
        searchDebounceTimer = setTimeout(() => runSymbolSearch(q), 300);
      });
      symbolInput.addEventListener('focus', () => {
        if (symbolInput.value.trim().length >= 2) runSymbolSearch(symbolInput.value.trim());
      });
      searchResultsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-search-pick]');
        if (!btn) return;
        symbolInput.value = btn.dataset.searchPick;
        syncSymbolChips();
        closeSearchResults();
        symbolInput.focus();
      });
      document.addEventListener('click', (e) => {
        if (e.target !== symbolInput && !e.target.closest('[data-symbol-search-results]')) closeSearchResults();
      });

      ctx.contentEl.querySelectorAll('[data-timeframe]').forEach((btn) => btn.addEventListener('click', () => {
        ctx.contentEl.querySelectorAll('[data-timeframe]').forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        selectedTimeframe = btn.dataset.timeframe;
      }));

      upsellBtn.addEventListener('click', () => openUpgradeModal());
      const upsellTitleEl = ctx.contentEl.querySelector('[data-upsell-title]');
      const upsellDescEl = ctx.contentEl.querySelector('[data-upsell-desc]');

      function applyQuota(plan, remainingToday, dailyLimit) {
        if (plan === 'pro') {
          quotaEl.textContent = '★ Análisis ilimitados (Business)';
          quotaExhausted = false;
          upsellEl.hidden = true;
          analyzeBtn.disabled = !selectedFile;
          return;
        }
        quotaEl.textContent = `${remainingToday} de ${dailyLimit} análisis ${plan === 'plus' ? '' : 'gratis '}hoy`;
        quotaExhausted = remainingToday <= 0;
        upsellEl.hidden = !quotaExhausted;
        if (quotaExhausted) {
          if (plan === 'plus') {
            upsellTitleEl.textContent = `Has usado tus ${dailyLimit} análisis de hoy.`;
            upsellDescEl.textContent = 'Hazte Business y analiza todos los gráficos que quieras, sin límite diario.';
          } else {
            upsellTitleEl.textContent = `Has usado tus ${dailyLimit} análisis gratuitos de hoy.`;
            upsellDescEl.textContent = 'Mejora tu plan y consigue más análisis al día (o ilimitados con Business).';
          }
        }
        analyzeBtn.disabled = quotaExhausted || !selectedFile;
      }

      const MAX_FILE_BYTES = 8 * 1024 * 1024;

      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
      });
      ['dragover', 'dragleave', 'drop'].forEach((evt) => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.toggle('is-dragover', evt === 'dragover');
        });
      });
      dropzone.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));
      fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

      // Pegar una captura directamente desde el portapapeles (Ctrl/Cmd+V) —
      // solo mientras el foco está en el propio dropzone, para no robarle
      // el paste a otros campos (símbolo, búsqueda, etc.) de la página.
      dropzone.addEventListener('paste', (e) => {
        const item = [...(e.clipboardData?.items || [])].find((it) => it.type.startsWith('image/'));
        if (!item) return;
        e.preventDefault();
        setFile(item.getAsFile());
      });

      function setFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          errorEl.textContent = 'Ese archivo no es una imagen. Sube una captura en PNG o JPG.';
          return;
        }
        if (file.size > MAX_FILE_BYTES) {
          errorEl.textContent = 'La imagen pesa demasiado (máximo 8 MB). Prueba con una captura más ligera.';
          return;
        }
        errorEl.textContent = '';
        selectedFile = file;
        preview.src = URL.createObjectURL(file);
        preview.hidden = false;
        analyzeBtn.disabled = quotaExhausted;
      }

      // Recorre los 3 pasos por tiempo, pero el último se queda "activo"
      // hasta que llega la respuesta real — nunca finge más tiempo del
      // que de verdad tarda la petición.
      function runProcessingSteps() {
        processingEl.classList.add('is-active');
        const steps = [...processingEl.querySelectorAll('.processing__step')];
        steps.forEach((s) => s.classList.remove('is-active', 'is-done'));
        let i = 0;
        const check = vantexIcon('check', { size: 11 });
        function activate(idx) {
          steps.forEach((s, si) => {
            s.classList.toggle('is-active', si === idx);
            if (si < idx) { s.classList.add('is-done'); s.querySelector('.processing__dot').innerHTML = check; }
          });
        }
        activate(0);
        const timer = setInterval(() => {
          i++;
          if (i >= steps.length - 1) { activate(steps.length - 1); clearInterval(timer); return; }
          activate(i);
        }, 900);
        return () => {
          clearInterval(timer);
          steps.forEach((s) => { s.classList.remove('is-active'); s.classList.add('is-done'); s.querySelector('.processing__dot').innerHTML = check; });
          setTimeout(() => processingEl.classList.remove('is-active'), 400);
        };
      }

      // El detalle completo (quick summary + escenarios/niveles/riesgo) vive
      // en shared/analysisCard.js — se comparte con /history para que
      // reabrir un análisis se vea idéntico en las dos páginas.
      function renderAnalysis(a) {
        emptyHintEl.hidden = true;
        resultEl.hidden = false;
        resultEl.classList.remove('reveal-pop');
        renderAnalysisDetail(resultEl, a);
        void resultEl.offsetWidth;
        resultEl.classList.add('reveal-pop');
        resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function renderHistory(analyses) {
        emptyHintEl.hidden = analyses.length > 0;
        renderAnalysisList(historyEl, analyses.slice(0, HISTORY_PREVIEW_COUNT), renderAnalysis);
      }

      analyzeBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        errorEl.textContent = '';
        analyzeBtn.disabled = true;
        analyzeBtn.innerHTML = '<span class="spinner"></span> Analizando…';
        const finishSteps = runProcessingSteps();
        try {
          const formData = new FormData();
          formData.append('image', selectedFile);
          const symbolHint = symbolInput.value.trim();
          if (symbolHint) formData.append('symbolHint', symbolHint);
          if (selectedTimeframe) formData.append('timeframe', selectedTimeframe);
          const { analysis } = await api('/analyzer', { method: 'POST', body: formData });
          finishSteps();
          renderAnalysis(analysis);
          await loadHistory();
          showToast({ type: 'success', message: 'Análisis completado. ✅' });
        } catch (err) {
          finishSteps();
          if (err.data && err.data.limitReached) {
            applyQuota(err.data.plan || 'free', 0, err.data.limit);
          } else {
            errorEl.textContent = err.message;
            showToast({ type: 'error', message: 'No se pudo completar el análisis.' });
          }
        } finally {
          analyzeBtn.innerHTML = `${vantexIcon('bolt', { size: 16 })} Analizar gráfico`;
          analyzeBtn.disabled = quotaExhausted || !selectedFile;
        }
      });

      async function loadHistory() {
        const { analyses, plan, remainingToday, dailyLimit } = await api('/analyzer/history');
        renderHistory(analyses);
        applyQuota(plan, remainingToday, dailyLimit);
      }
      loadHistory();

      // Si se llega desde un CTA externo con un activo preseleccionado
      // (p.ej. la sección de memecoins de la landing: /analyzer?symbol=
      // PEPE&category=memecoin), lo rellena y activa su categoría — nunca
      // dispara el análisis solo, siempre espera a que el usuario suba su
      // propia captura.
      const presetParams = new URLSearchParams(location.search);
      const presetSymbol = presetParams.get('symbol');
      const presetCategory = presetParams.get('category');
      if (presetCategory && ASSET_CATEGORIES.some((c) => c.key === presetCategory)) applyCategory(presetCategory);
      if (presetSymbol) {
        symbolInput.value = presetSymbol.toUpperCase().slice(0, 20);
        syncSymbolChips();
        showToast({ type: 'info', message: `Activo "${symbolInput.value}" listo — sube una captura de su gráfico para analizarlo.` });
      }
    });
  </script>
</body>
</html>
