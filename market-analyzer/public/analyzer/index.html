<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — AI Analyzer</title>
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .dropzone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 32px; text-align: center; cursor: pointer;
    background: var(--bg); transition: border-color .2s, transform .15s, background .2s;
  }
  .dropzone:hover { border-color: var(--accent); background: var(--accent-dim); }
  .dropzone.is-dragover { border-color: var(--accent); transform: scale(1.01); background: var(--accent-dim); }
  .dropzone__icon {
    width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 50%;
    background: var(--accent-dim); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s;
  }
  .dropzone:hover .dropzone__icon { transform: translateY(-3px) scale(1.05); }
  .dropzone img { max-width: 100%; max-height: 220px; border-radius: 10px; margin-top: 14px; animation: popIn .35s cubic-bezier(.34,1.56,.64,1); }
  .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 16px 0; }
  .result-grid .label { font-size: .75rem; text-transform: uppercase; color: var(--text-dim); letter-spacing: .03em; }
  .result-grid .value { font-weight: 700; margin-top: 2px; }
  .confidence-bar { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 6px; }
  .confidence-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #7c72f0); width: 0; transition: width 1s cubic-bezier(.16,.84,.44,1); }
  .history-item { padding: 14px 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; animation: fadeInUp .4s cubic-bezier(.16,.84,.44,1) both; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    mountShell({ page: 'analyzer', title: 'AI Analyzer' }).then((ctx) => {
      if (!ctx) return;
      ctx.contentEl.innerHTML = `
        <div class="panel reveal" style="margin-bottom:20px;">
          <div class="dropzone" data-dropzone>
            <div class="dropzone__icon">${vantexIcon('upload')}</div>
            <p style="margin:0; font-weight:600;">Arrastra una captura del gráfico aquí, o haz clic para elegirla</p>
            <p style="margin:6px 0 0; color:var(--text-dim); font-size:.8125rem;">PNG o JPG, hasta 8 MB</p>
            <input type="file" accept="image/*" data-file-input hidden />
            <img data-preview hidden />
          </div>
          <div style="display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap;">
            <button class="btn-primary" data-analyze-btn disabled>${vantexIcon('bolt', { size: 16 })} Analizar gráfico</button>
            <span style="color:var(--text-dim); font-size:.8125rem;" data-quota></span>
          </div>
          <p class="error-msg" data-error></p>
          <div class="panel reveal-pop" data-upsell hidden style="margin-top:14px; background:var(--accent-dim); border-color:var(--accent);">
            <strong>Has usado tus 3 análisis gratuitos de hoy.</strong>
            <p style="margin:6px 0 14px; color:var(--text-dim);">Hazte Pro y analiza todos los gráficos que quieras, sin límite diario.</p>
            <button class="btn-primary" data-upsell-btn>Hazte Pro por 4,99€/mes</button>
          </div>
        </div>

        <div class="panel" data-result hidden></div>

        <h2 style="font-size:1rem; margin: 28px 0 4px;">Historial reciente</h2>
        <div class="panel reveal" style="animation-delay:.1s" data-history>
          <div class="empty-state">
            <div class="empty-state__icon">${vantexIcon('inbox', { size: 26 })}</div>
            Todavía no has analizado ningún gráfico.
          </div>
        </div>
      `;

      const dropzone = ctx.contentEl.querySelector('[data-dropzone]');
      const fileInput = ctx.contentEl.querySelector('[data-file-input]');
      const preview = ctx.contentEl.querySelector('[data-preview]');
      const analyzeBtn = ctx.contentEl.querySelector('[data-analyze-btn]');
      const errorEl = ctx.contentEl.querySelector('[data-error]');
      const resultEl = ctx.contentEl.querySelector('[data-result]');
      const historyEl = ctx.contentEl.querySelector('[data-history]');
      const quotaEl = ctx.contentEl.querySelector('[data-quota]');
      const upsellEl = ctx.contentEl.querySelector('[data-upsell]');
      const upsellBtn = ctx.contentEl.querySelector('[data-upsell-btn]');
      let selectedFile = null;
      let quotaExhausted = false;

      upsellBtn.addEventListener('click', async () => {
        upsellBtn.disabled = true;
        upsellBtn.innerHTML = '<span class="spinner"></span> Un momento…';
        try {
          const { url } = await api('/billing/checkout', { method: 'POST' });
          window.location.href = url;
        } catch (e) {
          upsellBtn.disabled = false;
          upsellBtn.textContent = 'Hazte Pro por 4,99€/mes';
        }
      });

      function applyQuota(plan, remainingToday) {
        if (plan === 'pro') {
          quotaEl.textContent = '★ Análisis ilimitados (Pro)';
          quotaExhausted = false;
          upsellEl.hidden = true;
          return;
        }
        quotaEl.textContent = `${remainingToday} de 3 análisis gratis hoy`;
        quotaExhausted = remainingToday <= 0;
        upsellEl.hidden = !quotaExhausted;
        analyzeBtn.disabled = quotaExhausted || !selectedFile;
      }

      dropzone.addEventListener('click', () => fileInput.click());
      ['dragover', 'dragleave', 'drop'].forEach((evt) => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropzone.classList.toggle('is-dragover', evt === 'dragover');
        });
      });
      dropzone.addEventListener('drop', (e) => setFile(e.dataTransfer.files[0]));
      fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

      function setFile(file) {
        if (!file) return;
        selectedFile = file;
        preview.src = URL.createObjectURL(file);
        preview.hidden = false;
        analyzeBtn.disabled = quotaExhausted;
      }

      function renderAnalysis(a) {
        resultEl.hidden = false;
        resultEl.classList.remove('reveal-pop');
        resultEl.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <div style="font-weight:800; font-size:1.1rem;">${a.asset}</div>
              <div style="margin-top:6px; display:flex; gap:8px;">
                <span class="badge badge--${a.trend}">${a.trend}</span>
                <span class="badge badge--${a.bias}">${a.bias}</span>
                ${a.mock ? '<span class="badge badge--mock">Modo de ejemplo</span>' : ''}
              </div>
            </div>
          </div>
          <p style="margin:16px 0 6px; color:var(--text-dim);">Confianza del análisis: ${a.confidence}%</p>
          <div class="confidence-bar"><span data-confidence-fill></span></div>
          <div class="result-grid">
            <div>
              <div class="label">Soportes</div>
              <div class="value">${(a.support || []).join(' · ') || '—'}</div>
            </div>
            <div>
              <div class="label">Resistencias</div>
              <div class="value">${(a.resistance || []).join(' · ') || '—'}</div>
            </div>
          </div>
          <p style="line-height:1.5;">${a.summary}</p>
          <p class="disclaimer">${a.disclaimer}</p>
        `;
        // Fuerza reflow para que la transición de ancho se vea (si ya
        // estaba en 0 desde el render anterior, un cambio inmediato no
        // animaría) y reengancha la animación de entrada del panel.
        void resultEl.offsetWidth;
        resultEl.classList.add('reveal-pop');
        requestAnimationFrame(() => {
          resultEl.querySelector('[data-confidence-fill]').style.width = `${a.confidence}%`;
        });
      }

      function renderHistory(analyses) {
        if (!analyses.length) return;
        historyEl.innerHTML = analyses.map((a, i) => `
          <div class="history-item" style="animation-delay:${i * 0.05}s">
            <div>
              <strong>${a.asset}</strong>
              <span class="badge badge--${a.bias}" style="margin-left:8px;">${a.bias}</span>
            </div>
            <span style="color:var(--text-dim); font-size:.8125rem;">${new Date(a.createdAt).toLocaleString('es-ES')}</span>
          </div>
        `).join('');
      }

      analyzeBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        errorEl.textContent = '';
        analyzeBtn.disabled = true;
        analyzeBtn.innerHTML = '<span class="spinner"></span> Analizando…';
        try {
          const formData = new FormData();
          formData.append('image', selectedFile);
          const { analysis } = await api('/analyzer', { method: 'POST', body: formData });
          renderAnalysis(analysis);
          await loadHistory();
        } catch (err) {
          if (err.data && err.data.limitReached) {
            applyQuota('free', 0);
          } else {
            errorEl.textContent = err.message;
          }
        } finally {
          analyzeBtn.innerHTML = `${vantexIcon('bolt', { size: 16 })} Analizar gráfico`;
          analyzeBtn.disabled = quotaExhausted || !selectedFile;
        }
      });

      async function loadHistory() {
        const { analyses, plan, remainingToday } = await api('/analyzer/history');
        renderHistory(analyses);
        applyQuota(plan, remainingToday);
      }
      loadHistory();
    });
  </script>
</body>
</html>
