<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cryptolyzer — Paper Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .side-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .side-toggle button { flex: 1; padding: 9px; background: var(--surface); border: none; font-weight: 700; font-size: .8125rem; color: var(--text-dim); display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: background .15s, color .15s, transform .1s; }
  .side-toggle button[data-side="long"].is-active { background: var(--green-bg); color: var(--green); }
  .side-toggle button[data-side="short"].is-active { background: var(--red-bg); color: var(--red); }
  .side-toggle button:active { transform: scale(.97); }

  .ticket-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
  .ticket-row .field { margin-bottom: 0; min-width: 140px; }
  .ticket-advanced { border-top: 1px dashed var(--border); margin-top: 16px; padding-top: 16px; }
  .ticket-advanced summary { cursor: pointer; font-size: .8125rem; font-weight: 700; color: var(--text-dim); list-style: none; display: flex; align-items: center; gap: 6px; }
  .ticket-advanced summary::-webkit-details-marker { display: none; }
  .ticket-advanced summary svg { width: 14px; height: 14px; transition: transform .18s; }
  .ticket-advanced[open] summary svg { transform: rotate(90deg); }
  .ticket-advanced__body { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }

  .symbol-row { display: flex; align-items: center; gap: 14px; }
  .sparkline svg { display: block; }
  .live-price { font-weight: 800; font-size: 1.0625rem; font-variant-numeric: tabular-nums; }

  .badge--sl { background: var(--red-bg); color: var(--red); }
  .badge--tp { background: var(--green-bg); color: var(--green); }
  .badge--manual { background: var(--field-bg); color: var(--text-dim); }

  .skeleton-table-row { display: flex; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
  .skeleton-table-row:first-child { border-top: none; }

  .risk-calc__row { display: flex; justify-content: space-between; align-items: center; font-size: .8125rem; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  .risk-calc__row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .risk-calc input[type="range"] { width: 100%; appearance: none; height: 4px; border-radius: 999px; background: var(--field-bg); outline: none; margin-bottom: 4px; }
  .risk-calc input[type="range"]::-webkit-slider-thumb { appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; }
  .risk-calc input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; }
  .risk-calc__grid { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0; }
  .risk-calc__grid .field { min-width: 140px; margin-bottom: 0; }
  .risk-calc__result { background: var(--field-bg); border-radius: 10px; padding: 12px 14px; font-size: .8125rem; color: var(--text-dim); }
  .risk-calc__result strong { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ---------- Rediseño: cabecera + layout de dos columnas ---------- */
  .pt-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .pt-layout > div { min-width: 0; }
  @media (max-width: 1100px) { .pt-layout { grid-template-columns: 1fr; } }

  .pt-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .pt-head__left { display: flex; align-items: center; gap: 10px; }
  .pt-head__icon { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pt-head__label { font-weight: 800; font-size: .8125rem; letter-spacing: .03em; }
  .pt-badge-active { font-size: .625rem; font-weight: 800; letter-spacing: .03em; color: var(--green); background: var(--green-bg); border-radius: 999px; padding: 3px 9px; margin-left: 4px; }
  .pt-range-pills { display: flex; gap: 4px; background: var(--field-bg); border-radius: 10px; padding: 3px; }
  .pt-range-pill { border: none; background: transparent; font-size: .75rem; font-weight: 700; color: var(--text-dim); padding: 6px 11px; border-radius: 7px; }
  .pt-range-pill.is-active { background: #fff; color: var(--accent); box-shadow: 0 2px 6px rgba(20,22,43,.1); }

  .pt-balance-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .pt-balance-chart { width: 180px; height: 50px; flex-shrink: 0; }
  .pt-balance-chart svg { width: 100%; height: 100%; display: block; }

  .pt-info-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .pt-info-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--text-dim); background: var(--field-bg); border-radius: 999px; padding: 6px 12px; }
  .pt-info-chip strong { color: var(--text); font-weight: 700; }
  .pt-info-chip svg { width: 13px; height: 13px; }

  .pt-tabs { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .pt-tab { border: none; background: transparent; color: var(--text-dim); font-weight: 700; font-size: .8125rem; padding: 8px 2px 10px; border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px; margin-bottom: -1px; }
  .pt-tab.is-active { color: var(--accent); border-bottom-color: var(--accent); }
  .pt-tools-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .pt-search { position: relative; min-width: 180px; flex: 1 1 180px; max-width: 260px; }
  .pt-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-dim); }
  .pt-search input { width: 100%; border: 1px solid var(--border); background: var(--field-bg); border-radius: 9px; padding: 8px 10px 8px 30px; font-size: .8125rem; color: var(--text); }
  .pt-side-filter { border: 1px solid var(--border); background: var(--field-bg); border-radius: 9px; padding: 8px 10px; font-size: .8125rem; color: var(--text-dim); }

  .pt-perf-card { padding: 18px 20px; }
  .pt-perf-title { font-weight: 700; display: flex; align-items: center; gap: 7px; margin-bottom: 2px; }
  .pt-perf-sub { font-size: .75rem; color: var(--text-dim); margin-bottom: 14px; }
  .pt-perf-main .label { font-size: .75rem; color: var(--text-dim); }
  .pt-perf-main .val { font-size: 1.375rem; font-weight: 800; margin-top: 2px; }
  .pt-perf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .pt-perf-grid .label { font-size: .6875rem; color: var(--text-dim); margin-bottom: 2px; }
  .pt-perf-grid .val { font-weight: 700; font-size: .9375rem; }

  .pt-note { background: linear-gradient(135deg, var(--accent-dim), var(--blue-bg)); border: 1px solid var(--accent-dim); border-radius: 14px; padding: 14px 16px; font-size: .8125rem; color: var(--text-dim); display: flex; gap: 10px; }
  .pt-note svg { flex-shrink: 0; margin-top: 1px; width: 15px; height: 15px; color: var(--accent); }
  .pt-tips-card { padding: 18px 20px; }
  .pt-tips-title { font-weight: 700; display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .pt-tips-list { display: flex; flex-direction: column; gap: 10px; }
  .pt-tip { display: flex; align-items: flex-start; gap: 9px; font-size: .8125rem; color: var(--text-dim); line-height: 1.45; }
  .pt-tip-check { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--border-strong); flex-shrink: 0; margin-top: 1px; }

  .pt-cta-card { background: linear-gradient(135deg, var(--accent), var(--blue)); border-radius: 16px; padding: 18px; color: #fff; display: flex; align-items: center; gap: 14px; cursor: pointer; border: none; width: 100%; text-align: left; }
  .pt-cta-card__icon { width: 38px; height: 38px; border-radius: 11px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pt-cta-card__title { font-weight: 700; font-size: .875rem; }
  .pt-cta-card__desc { font-size: .75rem; opacity: .85; margin-top: 2px; }
  .pt-cta-card__arrow { margin-left: auto; flex-shrink: 0; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/cryptoIcon.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    const PT_RANGES = { '1D': 1, '1S': 7, '1M': 30, '3M': 90, '1A': 365 };

    function fmtDuration(ms) {
      if (ms == null) return '—';
      const mins = Math.round(ms / 60000);
      if (mins < 60) return `${mins} min`;
      const hours = Math.round(mins / 60);
      if (hours < 24) return `${hours} h`;
      const days = Math.round(hours / 24);
      return `${days} d`;
    }

    mountShell({ page: 'trading', title: 'Paper Trading' }).then((ctx) => {
      if (!ctx) return;
      showSectionIntro(ctx.user, 'trading', {
        icon: 'chartBar', iconBg: 'linear-gradient(135deg, #fb923c, #f97316, #ef4444)',
        title: 'Paper Trading — practica sin riesgo',
        desc: 'Empiezas con 100.000$ virtuales para abrir operaciones long/short y poner a prueba tus ideas sin arriesgar dinero real.',
        points: [
          'Puedes fijar un Stop Loss y un Take Profit opcionales — la posición se cierra sola si el precio los cruza.',
          'Tu saldo y P&amp;L se actualizan en vivo mientras se mueve el mercado.',
          'Ningún movimiento aquí usa dinero real ni se puede retirar.',
        ],
      });
      ctx.contentEl.innerHTML = `
        <div class="panel reveal-pop" data-sim-price-banner hidden style="margin-bottom:14px; background:var(--amber-bg); border-color:var(--amber); display:flex; align-items:center; gap:10px;">
          ${vantexIcon('alertTriangle', { size: 16 })}
          <span style="font-size:.8125rem; color:var(--text);"><strong>Precios simulados.</strong> No se ha podido conectar con la fuente de precios en vivo; estos precios son una aproximación generada por el servidor, no cotizaciones reales.</span>
        </div>

        <div class="pt-layout">
          <div>
            <div class="panel reveal" style="margin-bottom:20px;">
              <div class="pt-head">
                <div class="pt-head__left">
                  <span class="pt-head__icon">${vantexIcon('chartBar', { size: 18 })}</span>
                  <span class="pt-head__label">PAPER TRADING</span>
                  <span class="pt-badge-active">ACTIVO</span>
                </div>
                <div class="pt-range-pills" data-range-pills>
                  ${Object.keys(PT_RANGES).map((r, i) => `<button type="button" class="pt-range-pill ${i === 0 ? 'is-active' : ''}" data-range="${r}">${r}</button>`).join('')}
                </div>
              </div>

              <div class="pt-balance-row">
                <div class="stat-row" style="margin:0;">
                  <div class="stat-row__item">
                    <div class="label">Saldo virtual</div>
                    <div class="value" data-balance>—</div>
                  </div>
                  <div class="stat-row__item">
                    <div class="label">P&amp;L actual</div>
                    <div class="value" data-open-pnl>—</div>
                  </div>
                </div>
                <div class="pt-balance-chart" data-balance-chart></div>
              </div>

              <form data-trade-form>
                <input type="hidden" name="analysisId" data-analysis-id-input />
                <div class="ticket-row">
                  <div class="field">
                    <label>Símbolo</label>
                    <div class="symbol-row">
                      <select name="symbol" data-symbol-select></select>
                      <span class="sparkline" data-sparkline></span>
                    </div>
                  </div>
                  <div class="field">
                    <label>Precio actual</label>
                    <div class="live-price" data-live-price>—</div>
                  </div>
                  <div class="field">
                    <label>Dirección</label>
                    <div class="side-toggle">
                      <button type="button" data-side="long" class="is-active">${vantexIcon('arrowUp', { size: 14 })} Comprar</button>
                      <button type="button" data-side="short">${vantexIcon('arrowDown', { size: 14 })} Vender</button>
                    </div>
                    <input type="hidden" name="side" value="long" data-side-input />
                  </div>
                  <div class="field">
                    <label>Cantidad</label>
                    <input type="number" name="size" step="0.0001" min="0.0001" placeholder="0.5" required />
                  </div>
                </div>

                <details class="ticket-advanced" data-sltp-details>
                  <summary>${vantexIcon('chevronRight', { size: 14 })} Stop-loss / Take-profit (opcional)</summary>
                  <div class="ticket-advanced__body">
                    <div class="field">
                      <label>Stop-loss</label>
                      <input type="number" name="stopLoss" step="any" min="0" placeholder="Precio" data-risk-sl-link />
                    </div>
                    <div class="field">
                      <label>Take-profit</label>
                      <input type="number" name="takeProfit" step="any" min="0" placeholder="Precio" />
                    </div>
                  </div>
                </details>

                <details class="ticket-advanced risk-calc" data-risk-calc>
                  <summary>${vantexIcon('chartBar', { size: 14 })} Calculadora de tamaño de posición (opcional)</summary>
                  <div class="ticket-advanced__body" style="flex-direction:column; align-items:stretch;">
                    <p class="text-caption" style="margin:0 0 14px;">Calcula cuántas unidades comprar según cuánto de tu saldo estás dispuesto a arriesgar — no es una promesa de beneficio, solo matemática sobre tus propios números.</p>
                    <div class="risk-calc__row">
                      <span>Riesgo por operación</span>
                      <span data-risk-pct-label>1%</span>
                    </div>
                    <input type="range" min="0.25" max="5" step="0.25" value="1" data-risk-pct-input />
                    <div class="risk-calc__grid">
                      <div class="field">
                        <label>Precio de entrada</label>
                        <input type="number" step="any" min="0" placeholder="Precio actual" data-risk-entry-input />
                      </div>
                    </div>
                    <div class="risk-calc__result" data-risk-output>Añade un stop-loss arriba y un precio de entrada para calcular el tamaño según tu riesgo.</div>
                    <button type="button" class="btn-secondary" data-risk-apply hidden style="margin-top:12px; align-self:flex-start;">Usar este tamaño en el ticket</button>
                  </div>
                </details>

                <div style="margin-top:18px;">
                  <button class="btn-primary" type="submit">${vantexIcon('bolt', { size: 16 })} Abrir operación</button>
                </div>
              </form>
              <p class="error-msg" data-error></p>

              <div class="pt-info-chips">
                <span class="pt-info-chip">${vantexIcon('bolt', { size: 13 })} Apalancamiento: <strong>1x (sin apalancamiento)</strong></span>
                <span class="pt-info-chip">${vantexIcon('shieldCheck', { size: 13 })} Comisión: <strong>0%</strong></span>
                <span class="pt-info-chip">${vantexIcon('clock', { size: 13 })} Modo: <strong>Simulación</strong></span>
              </div>
            </div>

            <div class="panel reveal" style="animation-delay:.08s;">
              <div class="pt-tabs" data-pt-tabs>
                <button type="button" class="pt-tab is-active" data-tab="open">${vantexIcon('windowLayout', { size: 15 })} Posiciones</button>
                <button type="button" class="pt-tab" data-tab="closed">${vantexIcon('clock', { size: 15 })} Historial</button>
                <button type="button" class="pt-tab" data-tab="stats">${vantexIcon('chartBar', { size: 15 })} Estadísticas</button>
              </div>
              <div class="pt-tools-row">
                <div class="pt-search">
                  ${vantexIcon('search', { size: 14 })}
                  <input type="text" placeholder="Buscar activo…" data-pos-search />
                </div>
                <select class="pt-side-filter" data-pos-side-filter>
                  <option value="all">Todos</option>
                  <option value="long">Solo compras</option>
                  <option value="short">Solo ventas</option>
                </select>
              </div>
              <div data-positions>
                <div class="skeleton-table-row"><div class="skeleton skeleton-avatar"></div><div style="flex:1;"><div class="skeleton skeleton-text skeleton-text--md"></div><div class="skeleton skeleton-text skeleton-text--sm"></div></div></div>
                <div class="skeleton-table-row"><div class="skeleton skeleton-avatar"></div><div style="flex:1;"><div class="skeleton skeleton-text skeleton-text--md"></div><div class="skeleton skeleton-text skeleton-text--sm"></div></div></div>
              </div>
            </div>
          </div>

          <div>
            <div class="panel pt-perf-card reveal" style="animation-delay:.04s;">
              <div class="pt-perf-title">${vantexIcon('chartBar', { size: 16 })} Mi rendimiento</div>
              <div class="pt-perf-sub">Evolución de tu cuenta de trading</div>
              <div class="pt-perf-main">
                <div class="label">Beneficio/Pérdida</div>
                <div class="val" data-perf-pnl>—</div>
              </div>
              <div class="pt-perf-grid">
                <div><div class="label">Operaciones</div><div class="val" data-perf-trades>—</div></div>
                <div><div class="label">Acierto</div><div class="val" data-perf-winrate>—</div></div>
                <div><div class="label">Operación más larga</div><div class="val" data-perf-longest>—</div></div>
                <div><div class="label">Operación más corta</div><div class="val" data-perf-shortest>—</div></div>
              </div>
            </div>

            <div class="pt-note" style="margin:16px 0;">
              ${vantexIcon('shieldCheck', { size: 15 })}
              <span>El modo Paper Trading te permite practicar en un entorno real sin riesgo de pérdida de capital.</span>
            </div>

            <div class="panel pt-tips-card reveal" style="animation-delay:.08s; margin-bottom:16px;">
              <div class="pt-tips-title">💡 Consejos para empezar</div>
              <div class="pt-tips-list">
                <div class="pt-tip"><span class="pt-tip-check"></span>Empieza con activos de alta liquidez (como BTC o ETH).</div>
                <div class="pt-tip"><span class="pt-tip-check"></span>Define siempre un stop-loss antes de abrir la operación.</div>
                <div class="pt-tip"><span class="pt-tip-check"></span>Gestiona tu riesgo con la calculadora de tamaño de posición.</div>
                <div class="pt-tip"><span class="pt-tip-check"></span>Analiza tus resultados y mejora tu estrategia.</div>
              </div>
            </div>

            <button type="button" class="pt-cta-card" data-goto-analyzer>
              <span class="pt-cta-card__icon">${vantexIcon('trendUp', { size: 18 })}</span>
              <span>
                <div class="pt-cta-card__title">Mejora tu estrategia</div>
                <div class="pt-cta-card__desc">Analiza el mercado con Cryptolyzer AI y lleva tu trading al siguiente nivel.</div>
              </span>
              <span class="pt-cta-card__arrow">${vantexIcon('chevronRight', { size: 18 })}</span>
            </button>
          </div>
        </div>
      `;

      const simPriceBanner = ctx.contentEl.querySelector('[data-sim-price-banner]');
      const balanceEl = ctx.contentEl.querySelector('[data-balance]');
      const openPnlEl = ctx.contentEl.querySelector('[data-open-pnl]');
      const symbolSelect = ctx.contentEl.querySelector('[data-symbol-select]');
      const sparklineEl = ctx.contentEl.querySelector('[data-sparkline]');
      const livePriceEl = ctx.contentEl.querySelector('[data-live-price]');
      const sideButtons = ctx.contentEl.querySelectorAll('[data-side]');
      const sideInput = ctx.contentEl.querySelector('[data-side-input]');
      const form = ctx.contentEl.querySelector('[data-trade-form]');
      const analysisIdInput = form.querySelector('[data-analysis-id-input]');
      const errorEl = ctx.contentEl.querySelector('[data-error]');
      const positionsEl = ctx.contentEl.querySelector('[data-positions]');
      const balanceChartEl = ctx.contentEl.querySelector('[data-balance-chart]');
      const rangePillsEl = ctx.contentEl.querySelector('[data-range-pills]');
      const posSearchInput = ctx.contentEl.querySelector('[data-pos-search]');
      const posSideFilter = ctx.contentEl.querySelector('[data-pos-side-filter]');
      let lastBalance = null;
      let lastOpenPnl = null;
      let firstLoad = true;
      const seenClosedIds = new Set();
      let latestData = null;
      let activeTab = 'open';
      let activeRange = '1D';
      let posSearch = '';
      let posSide = 'all';

      ctx.contentEl.querySelector('[data-goto-analyzer]').addEventListener('click', () => { location.href = '/analyzer'; });

      sideButtons.forEach((btn) => btn.addEventListener('click', () => {
        sideButtons.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        sideInput.value = btn.dataset.side;
      }));

      rangePillsEl.querySelectorAll('[data-range]').forEach((btn) => btn.addEventListener('click', () => {
        activeRange = btn.dataset.range;
        rangePillsEl.querySelectorAll('[data-range]').forEach((b) => b.classList.toggle('is-active', b === btn));
        if (latestData) renderBalanceChart(latestData.balanceHistory);
      }));

      ctx.contentEl.querySelector('[data-pt-tabs]').querySelectorAll('[data-tab]').forEach((btn) => btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        ctx.contentEl.querySelectorAll('[data-pt-tabs] [data-tab]').forEach((b) => b.classList.toggle('is-active', b === btn));
        if (latestData) renderPositions(latestData);
      }));
      posSearchInput.addEventListener('input', () => { posSearch = posSearchInput.value.trim().toLowerCase(); if (latestData) renderPositions(latestData); });
      posSideFilter.addEventListener('change', () => { posSide = posSideFilter.value; if (latestData) renderPositions(latestData); });

      // Puente "Simular este escenario" desde el AI Analyzer: rellena el
      // ticket con el símbolo/lado/SL/TP del análisis, nunca lo envía solo
      // — el usuario siempre confirma antes de abrir nada.
      function applyPrefillFromAnalysis(supportedSymbols) {
        const params = new URLSearchParams(location.search);
        const symbol = params.get('symbol');
        if (symbol && supportedSymbols.includes(symbol)) symbolSelect.value = symbol;
        const side = params.get('side');
        if (side === 'short' || side === 'long') {
          sideButtons.forEach((b) => b.classList.toggle('is-active', b.dataset.side === side));
          sideInput.value = side;
        }
        const sl = params.get('stopLoss');
        if (sl && stopLossInput) stopLossInput.value = Number(sl).toFixed(sl < 100 ? 4 : 2);
        const tp = params.get('takeProfit');
        const tpInput = form.querySelector('input[name="takeProfit"]');
        if (tp && tpInput) tpInput.value = Number(tp).toFixed(tp < 100 ? 4 : 2);
        const analysisId = params.get('analysisId');
        if (analysisId) analysisIdInput.value = analysisId;
        if (symbol || side || sl || tp) {
          history.replaceState(null, '', location.pathname);
          showToast({ type: 'info', message: 'Ticket rellenado desde tu análisis. Revisa los datos antes de abrir la posición.' });
        }
      }

      async function loadSparkline() {
        const symbol = symbolSelect.value;
        if (!symbol) return;
        try {
          const { history } = await api(`/trading/chart/${symbol}`);
          renderSparkline(history);
          if (history && history.length && !riskEntryTouched) {
            riskEntryInput.value = history[history.length - 1].price;
            updateRiskCalc();
          }
        } catch (e) { /* el sparkline es un detalle visual, no bloquea el resto de la página */ }
      }
      function renderSparkline(history) {
        const w = 100, h = 32;
        if (!history || history.length < 2) { sparklineEl.innerHTML = `<svg width="${w}" height="${h}"></svg>`; return; }
        const prices = history.map((p) => p.price);
        const min = Math.min(...prices), max = Math.max(...prices);
        const span = (max - min) || 1;
        const up = prices[prices.length - 1] >= prices[0];
        const points = prices.map((p, i) => {
          const x = (i / (prices.length - 1)) * w;
          const y = h - ((p - min) / span) * h;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        sparklineEl.innerHTML = `
          <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
            <polyline points="${points}" fill="none" stroke="${up ? 'var(--green)' : 'var(--red)'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        `;
      }
      symbolSelect.addEventListener('change', loadSparkline);

      // Evolución real del saldo (balanceHistory ya viene reconstruida en
      // el servidor a partir del historial real de cierres) — el filtro
      // de rango solo recorta esa misma serie real por fecha, nunca
      // genera puntos nuevos. Con 0 operaciones cerradas, la línea es
      // plana en 100.000 — eso es lo honesto para una cuenta nueva.
      function renderBalanceChart(balanceHistory) {
        const w = 180, h = 50;
        const rangeDays = PT_RANGES[activeRange];
        const cutoff = Date.now() - rangeDays * 24 * 60 * 60 * 1000;
        let points = (balanceHistory || []).filter((p) => new Date(p.t).getTime() >= cutoff);
        if (points.length < 2) points = balanceHistory || [];
        if (!points.length) { balanceChartEl.innerHTML = ''; return; }
        const values = points.map((p) => p.balance);
        const min = Math.min(...values), max = Math.max(...values);
        const span = (max - min) || Math.max(1, min * 0.01) || 1;
        const up = values[values.length - 1] >= values[0];
        const coords = values.map((v, i) => {
          const x = points.length > 1 ? (i / (points.length - 1)) * w : 0;
          const y = h - 4 - ((v - min) / span) * (h - 8);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        balanceChartEl.innerHTML = `
          <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
            <polyline points="${coords}" fill="none" stroke="${up ? 'var(--accent)' : 'var(--red)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        `;
      }

      // ---------- Calculadora de tamaño de posición ----------
      const riskPctInput = ctx.contentEl.querySelector('[data-risk-pct-input]');
      const riskPctLabel = ctx.contentEl.querySelector('[data-risk-pct-label]');
      const riskEntryInput = ctx.contentEl.querySelector('[data-risk-entry-input]');
      const riskOutputEl = ctx.contentEl.querySelector('[data-risk-output]');
      const riskApplyBtn = ctx.contentEl.querySelector('[data-risk-apply]');
      const stopLossInput = form.querySelector('[data-risk-sl-link]');
      const sltpDetails = form.querySelector('[data-sltp-details]');
      const riskCalcDetails = form.querySelector('[data-risk-calc]');
      const sizeInput = form.querySelector('[name="size"]');
      let riskEntryTouched = false;
      let suggestedSize = null;

      riskCalcDetails.addEventListener('toggle', () => {
        if (riskCalcDetails.open) sltpDetails.open = true;
      });

      riskEntryInput.addEventListener('input', () => { riskEntryTouched = true; updateRiskCalc(); });
      riskPctInput.addEventListener('input', updateRiskCalc);
      stopLossInput.addEventListener('input', updateRiskCalc);
      symbolSelect.addEventListener('change', () => { riskEntryTouched = false; });

      function updateRiskCalc() {
        const pct = Number(riskPctInput.value) || 0;
        riskPctLabel.textContent = `${pct}%`;
        const entry = Number(riskEntryInput.value);
        const sl = Number(stopLossInput.value);
        suggestedSize = null;
        riskApplyBtn.hidden = true;
        if (!entry || !sl || entry === sl || !lastBalance) {
          riskOutputEl.textContent = 'Añade un stop-loss arriba y un precio de entrada para calcular el tamaño según tu riesgo.';
          return;
        }
        const riskAmount = lastBalance * (pct / 100);
        const perUnitRisk = Math.abs(entry - sl);
        suggestedSize = riskAmount / perUnitRisk;
        const positionValue = suggestedSize * entry;
        riskOutputEl.innerHTML = `Arriesgas <strong>${fmtUsd(riskAmount)}</strong> (${pct}% de tu saldo) si el precio llega al stop-loss.<br>Tamaño sugerido: <strong>${suggestedSize.toFixed(4)}</strong> unidades (≈ ${fmtUsd(positionValue)}).`;
        riskApplyBtn.hidden = false;
      }
      riskApplyBtn.addEventListener('click', () => {
        if (suggestedSize == null) return;
        sizeInput.value = suggestedSize.toFixed(4);
        showToast({ type: 'info', message: 'Tamaño aplicado al ticket.' });
      });

      function fmtSign(n) { return n >= 0 ? '+' : ''; }

      function renderConfirmModal({ title, rows, confirmLabel, onConfirm }) {
        openModal({
          title,
          bodyHtml: `
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${rows.map(([label, value]) => `
                <div style="display:flex; justify-content:space-between; gap:12px; font-size:.875rem;">
                  <span class="text-caption">${label}</span>
                  <strong>${value}</strong>
                </div>
              `).join('')}
            </div>
          `,
          footerHtml: `
            <button type="button" class="btn-secondary" data-modal-close>Cancelar</button>
            <button type="button" class="btn-primary" data-confirm-action>${confirmLabel}</button>
          `,
          onOpen: (root) => {
            root.querySelector('[data-confirm-action]').addEventListener('click', async (e) => {
              const btn = e.currentTarget;
              btn.disabled = true;
              btn.innerHTML = '<span class="spinner"></span> Un momento…';
              await onConfirm(btn);
            });
          },
        });
      }

      function renderPerf(stats) {
        const pnlClass = stats.totalRealizedPnl >= 0 ? 'pnl-pos' : 'pnl-neg';
        const pct = (stats.totalRealizedPnl / 100000) * 100;
        ctx.contentEl.querySelector('[data-perf-pnl]').innerHTML = `<span class="${pnlClass}">${fmtUsd(stats.totalRealizedPnl)} (${fmtSign(pct)}${pct.toFixed(2)}%)</span>`;
        ctx.contentEl.querySelector('[data-perf-trades]').textContent = stats.totalTrades;
        ctx.contentEl.querySelector('[data-perf-winrate]').textContent = stats.winRate != null ? `${stats.winRate}%` : '—';
        ctx.contentEl.querySelector('[data-perf-longest]').textContent = stats.longestTrade ? `${stats.longestTrade.symbol} · ${fmtDuration(stats.longestTrade.ms)}` : '—';
        ctx.contentEl.querySelector('[data-perf-shortest]').textContent = stats.shortestTrade ? `${stats.shortestTrade.symbol} · ${fmtDuration(stats.shortestTrade.ms)}` : '—';
      }

      function renderPositions(data) {
        let rows = data.positions.filter((p) => activeTab === 'stats' ? false : (activeTab === 'open' ? p.status === 'open' : p.status === 'closed'));
        if (posSearch) rows = rows.filter((p) => p.symbol.toLowerCase().includes(posSearch));
        if (posSide !== 'all') rows = rows.filter((p) => p.side === posSide);

        if (activeTab === 'stats') {
          const s = data.stats;
          positionsEl.innerHTML = `
            <div class="result-grid">
              <div><div class="label">Operaciones cerradas</div><div class="value">${s.totalTrades}</div></div>
              <div><div class="label">Acierto</div><div class="value">${s.winRate != null ? s.winRate + '%' : '—'}</div></div>
              <div><div class="label">P&amp;L total realizado</div><div class="value ${s.totalRealizedPnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${fmtUsd(s.totalRealizedPnl)}</div></div>
              <div><div class="label">Operación más larga</div><div class="value">${s.longestTrade ? `${s.longestTrade.symbol} · ${fmtDuration(s.longestTrade.ms)}` : '—'}</div></div>
              <div><div class="label">Operación más corta</div><div class="value">${s.shortestTrade ? `${s.shortestTrade.symbol} · ${fmtDuration(s.shortestTrade.ms)}` : '—'}</div></div>
            </div>
            <p class="disclaimer">Estadísticas reales de tu propio historial de Paper Trading — nunca una cifra de rendimiento inventada.</p>
          `;
          return;
        }

        if (!rows.length) {
          positionsEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">${vantexIcon('chartBar', { size: 26 })}</div>
              <strong>${activeTab === 'open' ? 'Todavía no tienes posiciones abiertas' : 'Todavía no tienes historial'}</strong>
              <span>${activeTab === 'open' ? 'Abre tu primera operación y empieza a practicar con el mercado real.' : 'Cuando cierres una operación, aparecerá aquí.'}</span>
              ${activeTab === 'open' ? `<button type="button" class="btn-primary" data-goto-market style="margin-top:14px;">→ Ir al mercado</button>` : ''}
            </div>
          `;
          const gotoBtn = positionsEl.querySelector('[data-goto-market]');
          if (gotoBtn) gotoBtn.addEventListener('click', () => { location.href = '/picks'; });
          return;
        }

        positionsEl.innerHTML = `
          <table>
            <thead><tr><th>Símbolo</th><th>Lado</th><th>Tamaño</th><th>Entrada</th><th>Actual/Cierre</th><th>P&amp;L</th><th>%</th><th></th></tr></thead>
            <tbody>
              ${rows.map((p) => {
                const pnl = p.status === 'open' ? p.unrealizedPnl : p.realizedPnl;
                const pnlClass = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
                const lastPrice = p.status === 'open' ? p.currentPrice : p.closePrice;
                const reasonBadge = p.status === 'closed'
                  ? `<span class="badge badge--${p.closeReason === 'sl' ? 'sl' : p.closeReason === 'tp' ? 'tp' : 'manual'}" style="margin-left:6px;">${p.closeReason === 'sl' ? 'SL' : p.closeReason === 'tp' ? 'TP' : 'manual'}</span>`
                  : '';
                const fromAnalysis = p.analysisId
                  ? `<a href="/history?id=${p.analysisId}" title="Abierta desde un análisis — ver detalle" style="margin-left:6px; display:inline-flex; vertical-align:middle; color:var(--text-dim);">${vantexIcon('brain', { size: 13 })}</a>`
                  : '';
                return `
                  <tr>
                    <td style="display:flex; align-items:center; gap:8px;">${cryptoIconHtml(p.symbol, 20)}${p.symbol}${fromAnalysis}</td>
                    <td><span class="badge badge--${p.side}">${p.side}</span></td>
                    <td>${p.size}</td>
                    <td>${fmtPrice(p.entryPrice)}</td>
                    <td>${lastPrice != null ? fmtPrice(lastPrice) : '—'}${reasonBadge}</td>
                    <td class="${pnlClass}">${pnl != null ? fmtUsd(pnl) : '—'}</td>
                    <td class="${pnlClass}">${p.pnlPercent != null ? fmtSign(p.pnlPercent) + p.pnlPercent.toFixed(1) + '%' : '—'}</td>
                    <td>${p.status === 'open' ? `<button class="btn-secondary" data-close="${p.id}">Cerrar</button>` : ''}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
        mountCryptoIcons(positionsEl);

        positionsEl.querySelectorAll('[data-close]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.close;
            const pos = data.positions.find((p) => p.id === id);
            renderConfirmModal({
              title: 'Cerrar operación',
              rows: [
                ['Símbolo', pos.symbol],
                ['Lado', pos.side],
                ['Tamaño', pos.size],
                ['Precio actual', pos.currentPrice != null ? fmtPrice(pos.currentPrice) : '—'],
                ['P&L estimado', pos.unrealizedPnl != null ? fmtUsd(pos.unrealizedPnl) : '—'],
              ],
              confirmLabel: 'Cerrar operación',
              onConfirm: async () => {
                try {
                  await api(`/trading/${id}/close`, { method: 'POST' });
                  closeModal();
                  showToast({ type: 'success', message: `Operación de ${pos.symbol} cerrada. 🔒` });
                  await load();
                } catch (err) {
                  closeModal();
                  showToast({ type: 'error', message: err.message });
                }
              },
            });
          });
        });
      }

      function render(data) {
        latestData = data;
        simPriceBanner.hidden = !data.isSimulatedPricing;
        animateNumber(balanceEl, lastBalance ?? data.balance, data.balance, { format: (n) => fmtUsd(n) });
        lastBalance = data.balance;

        symbolSelect.innerHTML = data.supportedSymbols.map((s) => `<option value="${s}">${s}</option>`).join('');
        if (firstLoad) {
          applyPrefillFromAnalysis(data.supportedSymbols);
          loadSparkline();
        }

        const open = data.positions.filter((p) => p.status === 'open');
        const totalOpenPnl = open.reduce((sum, p) => sum + (p.unrealizedPnl || 0), 0);
        openPnlEl.className = 'value ' + (totalOpenPnl >= 0 ? 'pnl-pos' : 'pnl-neg');
        animateNumber(openPnlEl, lastOpenPnl ?? totalOpenPnl, totalOpenPnl, { format: (n) => fmtUsd(n) });
        lastOpenPnl = totalOpenPnl;

        const currentSymbolPos = open.find((p) => p.symbol === symbolSelect.value);
        if (currentSymbolPos && currentSymbolPos.currentPrice != null) {
          livePriceEl.textContent = fmtPrice(currentSymbolPos.currentPrice);
        }

        if (!firstLoad) {
          data.positions
            .filter((p) => p.status === 'closed' && (p.closeReason === 'sl' || p.closeReason === 'tp') && !seenClosedIds.has(p.id))
            .forEach((p) => {
              showToast({ type: p.closeReason === 'tp' ? 'success' : 'info', message: `${p.symbol} se cerró sola por ${p.closeReason === 'tp' ? 'take-profit' : 'stop-loss'}.` });
            });
        }
        data.positions.forEach((p) => { if (p.status === 'closed') seenClosedIds.add(p.id); });
        firstLoad = false;

        renderPerf(data.stats);
        renderBalanceChart(data.balanceHistory);
        renderPositions(data);
      }

      async function load() {
        const data = await api('/trading');
        render(data);
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      const submitBtnDefaultHtml = submitBtn.innerHTML;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        const payload = Object.fromEntries(new FormData(form).entries());
        if (!payload.stopLoss) delete payload.stopLoss;
        if (!payload.takeProfit) delete payload.takeProfit;
        if (!payload.analysisId) delete payload.analysisId;

        renderConfirmModal({
          title: 'Confirmar operación',
          rows: [
            ['Símbolo', payload.symbol],
            ['Dirección', payload.side === 'long' ? 'Comprar (long)' : 'Vender (short)'],
            ['Cantidad', payload.size],
            ['Precio actual', livePriceEl.textContent],
            ...(payload.stopLoss ? [['Stop-loss', fmtPrice(payload.stopLoss)]] : []),
            ...(payload.takeProfit ? [['Take-profit', fmtPrice(payload.takeProfit)]] : []),
          ],
          confirmLabel: 'Abrir operación',
          onConfirm: async () => {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Abriendo…';
            try {
              await api('/trading', { method: 'POST', body: JSON.stringify(payload) });
              closeModal();
              form.reset();
              sideButtons.forEach((b) => b.classList.remove('is-active'));
              ctx.contentEl.querySelector('[data-side="long"]').classList.add('is-active');
              sideInput.value = 'long';
              showToast({ type: 'success', message: 'Operación abierta. 📈' });
              await load();
            } catch (err) {
              closeModal();
              errorEl.textContent = err.message;
              showToast({ type: 'error', message: err.message });
            } finally {
              submitBtn.disabled = false;
              submitBtn.innerHTML = submitBtnDefaultHtml;
            }
          },
        });
      });

      load();
      setInterval(load, 15000); // refresca precios/P&L cada 15s
      setInterval(loadSparkline, 15000);
    });
  </script>
</body>
</html>
