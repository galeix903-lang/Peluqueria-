<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — Paper Trading</title>
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .side-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .side-toggle button { flex: 1; padding: 9px; background: var(--surface); border: none; font-weight: 700; font-size: .8125rem; color: var(--text-dim); transition: background .15s, color .15s; }
  .side-toggle button[data-side="long"].is-active { background: var(--green-bg); color: var(--green); }
  .side-toggle button[data-side="short"].is-active { background: var(--red-bg); color: var(--red); }
  .trade-form { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .trade-form .field { margin-bottom: 0; min-width: 140px; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    mountShell({ page: 'trading', title: 'Paper Trading' }).then((ctx) => {
      if (!ctx) return;
      ctx.contentEl.innerHTML = `
        <div class="panel reveal" style="margin-bottom:20px;">
          <div class="stat-row">
            <div class="stat-row__item">
              <div class="label">Saldo</div>
              <div class="value" data-balance>—</div>
            </div>
            <div class="stat-row__item">
              <div class="label">P&amp;L abierto</div>
              <div class="value" data-open-pnl>—</div>
            </div>
          </div>

          <form class="trade-form" data-trade-form>
            <div class="field">
              <label>Símbolo</label>
              <select name="symbol" data-symbol-select></select>
            </div>
            <div class="field">
              <label>Dirección</label>
              <div class="side-toggle">
                <button type="button" data-side="long" class="is-active">Long</button>
                <button type="button" data-side="short">Short</button>
              </div>
              <input type="hidden" name="side" value="long" data-side-input />
            </div>
            <div class="field">
              <label>Tamaño</label>
              <input type="number" name="size" step="0.0001" min="0" placeholder="0.5" required />
            </div>
            <button class="btn-primary" type="submit">${vantexIcon('bolt', { size: 16 })} Abrir operación</button>
          </form>
          <p class="error-msg" data-error></p>
        </div>

        <div class="panel reveal" style="animation-delay:.08s" data-positions>
          <div class="empty-state">
            <div class="empty-state__icon">${vantexIcon('chartBar', { size: 26 })}</div>
            Todavía no tienes operaciones.
          </div>
        </div>
      `;

      const balanceEl = ctx.contentEl.querySelector('[data-balance]');
      const openPnlEl = ctx.contentEl.querySelector('[data-open-pnl]');
      const symbolSelect = ctx.contentEl.querySelector('[data-symbol-select]');
      const sideButtons = ctx.contentEl.querySelectorAll('[data-side]');
      const sideInput = ctx.contentEl.querySelector('[data-side-input]');
      const form = ctx.contentEl.querySelector('[data-trade-form]');
      const errorEl = ctx.contentEl.querySelector('[data-error]');
      const positionsEl = ctx.contentEl.querySelector('[data-positions]');

      sideButtons.forEach((btn) => btn.addEventListener('click', () => {
        sideButtons.forEach((b) => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        sideInput.value = btn.dataset.side;
      }));

      function fmtUsd(n) {
        return n.toLocaleString('es-ES', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
      }

      // Da un pequeño "pop" visual cuando un número cambia de verdad, en
      // vez de repintar en silencio — ayuda a que se note que la app está
      // viva (precios/P&L en movimiento), no solo texto estático.
      function setNumberWithFlash(el, text) {
        if (el.textContent !== text) {
          el.textContent = text;
          el.classList.remove('pnl-flash');
          void el.offsetWidth;
          el.classList.add('pnl-flash');
        }
      }

      function render(data) {
        setNumberWithFlash(balanceEl, fmtUsd(data.balance));
        symbolSelect.innerHTML = data.supportedSymbols.map((s) => `<option value="${s}">${s}</option>`).join('');

        const open = data.positions.filter((p) => p.status === 'open');
        const totalOpenPnl = open.reduce((sum, p) => sum + (p.unrealizedPnl || 0), 0);
        openPnlEl.className = 'value ' + (totalOpenPnl >= 0 ? 'pnl-pos' : 'pnl-neg');
        setNumberWithFlash(openPnlEl, fmtUsd(totalOpenPnl));

        if (!data.positions.length) {
          positionsEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">${vantexIcon('chartBar', { size: 26 })}</div>
              Todavía no tienes operaciones.
            </div>
          `;
          return;
        }

        positionsEl.innerHTML = `
          <table>
            <thead><tr><th>Símbolo</th><th>Lado</th><th>Tamaño</th><th>Entrada</th><th>Actual/Cierre</th><th>P&amp;L</th><th></th></tr></thead>
            <tbody>
              ${data.positions.map((p) => {
                const pnl = p.status === 'open' ? p.unrealizedPnl : p.realizedPnl;
                const pnlClass = pnl >= 0 ? 'pnl-pos' : 'pnl-neg';
                const lastPrice = p.status === 'open' ? p.currentPrice : p.closePrice;
                return `
                  <tr>
                    <td>${p.symbol}</td>
                    <td><span class="badge badge--${p.side}">${p.side}</span></td>
                    <td>${p.size}</td>
                    <td>${fmtUsd(p.entryPrice)}</td>
                    <td>${lastPrice != null ? fmtUsd(lastPrice) : '—'}</td>
                    <td class="${pnlClass}">${pnl != null ? fmtUsd(pnl) : '—'}</td>
                    <td>${p.status === 'open' ? `<button class="btn-secondary" data-close="${p.id}">Cerrar</button>` : ''}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        positionsEl.querySelectorAll('[data-close]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner" style="border-color:rgba(0,0,0,.15); border-top-color:var(--text-dim);"></span>';
            try {
              await api(`/trading/${btn.dataset.close}/close`, { method: 'POST' });
              await load();
            } catch (err) {
              errorEl.textContent = err.message;
              btn.disabled = false;
              btn.textContent = 'Cerrar';
            }
          });
        });
      }

      async function load() {
        const data = await api('/trading');
        render(data);
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      const submitBtnDefaultHtml = submitBtn.innerHTML;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Abriendo…';
        const payload = Object.fromEntries(new FormData(form).entries());
        try {
          await api('/trading', { method: 'POST', body: JSON.stringify(payload) });
          form.reset();
          sideButtons.forEach((b) => b.classList.remove('is-active'));
          ctx.contentEl.querySelector('[data-side="long"]').classList.add('is-active');
          sideInput.value = 'long';
          await load();
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = submitBtnDefaultHtml;
        }
      });

      load();
      setInterval(load, 15000); // refresca precios/P&L cada 15s
    });
  </script>
</body>
</html>
