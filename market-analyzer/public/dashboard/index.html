<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .market-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 22px; }
  .market-chip {
    flex-shrink: 0; min-width: 132px; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .market-chip__symbol { font-size: .75rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .03em; }
  .market-chip__price { font-size: 1.0625rem; font-weight: 800; margin-top: 4px; }
  .market-chip__change { font-size: .75rem; font-weight: 700; margin-top: 2px; }

  .dash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  @media (max-width: 820px) { .dash-cols { grid-template-columns: 1fr; } }
  .dash-col-card { padding: 18px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
  .dash-col-card__title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .dash-col-card__title span:first-child { font-size: .8125rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-dim); }
  .dash-col-card__title a { font-size: .8125rem; font-weight: 700; color: var(--accent); text-decoration: none; }

  .tools-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .tool-chip {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: inherit;
    transition: border-color .15s, transform .12s;
  }
  .tool-chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tool-chip__icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .tool-chip__label { font-size: .875rem; font-weight: 700; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    const SIGNAL_META = {
      BUY: { icon: 'arrowUp', label: 'Sesgo alcista', cls: 'buy' },
      SELL: { icon: 'arrowDown', label: 'Sesgo bajista', cls: 'sell' },
      WAIT: { icon: 'arrowRight', label: 'Neutral', cls: 'wait' },
    };

    mountShell({ page: 'dashboard', title: 'Bienvenido de nuevo 👋' }).then((ctx) => {
      if (!ctx) return;

      // Personaliza el título ahora que ya conocemos al usuario.
      document.querySelector('.topbar h1').textContent = `Bienvenido de nuevo, ${ctx.user.name} 👋`;

      const params = new URLSearchParams(location.search);
      let banner = '';
      if (params.get('upgraded') === 'plus') {
        banner = '<div class="panel reveal-pop" style="margin-bottom:24px; background:var(--green-bg); border-color:var(--green);">🎉 <strong>¡Bienvenido a Vantex Pro!</strong> Ya tienes 15 análisis al día y Copy Trading simulado.</div>';
      } else if (params.get('upgraded')) {
        banner = '<div class="panel reveal-pop" style="margin-bottom:24px; background:var(--green-bg); border-color:var(--green);">🎉 <strong>¡Bienvenido a Vantex Business!</strong> Ya tienes análisis ilimitados en el AI Analyzer.</div>';
      } else if (params.get('downgraded')) {
        banner = '<div class="panel reveal-pop" style="margin-bottom:24px;">Has vuelto al plan gratuito (3 análisis al día).</div>';
      }
      if (banner) history.replaceState(null, '', location.pathname);

      const statSkeleton = `
        <div class="stat-row-cards">
          ${[0, 1, 2, 3].map(() => `
            <div class="stat-card">
              <div class="skeleton skeleton-avatar" style="border-radius:13px;"></div>
              <div class="stat-card__body" style="flex:1;">
                <div class="skeleton skeleton-text skeleton-text--sm"></div>
                <div class="skeleton skeleton-text" style="width:60%; height:1.5rem;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      ctx.contentEl.innerHTML = `
        ${banner}

        <div class="dash-col-card__title" style="margin-bottom:10px;"><span>Mercado</span></div>
        <div data-market class="market-row">
          ${[0, 1, 2, 3, 4].map(() => `<div class="market-chip skeleton" style="height:64px;"></div>`).join('')}
        </div>

        <div class="dash-cols">
          <div class="dash-col-card">
            <div class="dash-col-card__title"><span>Tu último análisis</span><a href="/analyzer">Ver todos →</a></div>
            <div data-latest-analysis>
              <div class="skeleton skeleton-text" style="width:40%;"></div>
              <div class="skeleton skeleton-text" style="width:80%; margin-top:8px;"></div>
            </div>
          </div>
          <div class="dash-col-card">
            <div class="dash-col-card__title"><span>Market Scanner</span><a href="/picks">Ver todo →</a></div>
            <div data-scanner-preview>
              <div class="skeleton skeleton-text" style="width:40%;"></div>
              <div class="skeleton skeleton-text" style="width:80%; margin-top:8px;"></div>
            </div>
          </div>
        </div>

        <div data-stats>${statSkeleton}</div>
        <div data-cta></div>

        <div class="dash-col-card__title" style="margin-bottom:12px;"><span>Más herramientas</span></div>
        <div class="tools-row">
          <a href="/wallet" class="tool-chip">
            <span class="tool-chip__icon" style="background:linear-gradient(135deg, #0ea5e9, #22d3ee);">${vantexIcon('eye', { size: 16 })}</span>
            <span class="tool-chip__label">Wallet Tracker</span>
          </a>
          <a href="/copy" class="tool-chip">
            <span class="tool-chip__icon" style="background:linear-gradient(135deg, #8b5cf6, #a855f7);">${vantexIcon('sparkle', { size: 16 })}</span>
            <span class="tool-chip__label">Copy Trading</span>
          </a>
        </div>
      `;

      loadOverview(ctx.contentEl);
      loadMarketOverview(ctx.contentEl);
      loadLatestAnalysis(ctx.contentEl);
      loadScannerPreview(ctx.contentEl);
    });

    async function loadMarketOverview(contentEl) {
      const marketEl = contentEl.querySelector('[data-market]');
      try {
        const { prices, changes, isSimulatedPricing } = await api('/trading/prices');
        const symbols = Object.keys(prices);
        if (!symbols.length) {
          marketEl.innerHTML = `<p class="text-caption">No se han podido obtener precios en tiempo real.</p>`;
          return;
        }
        marketEl.innerHTML = symbols.map((s) => {
          const change = changes[s];
          const positive = change != null && change >= 0;
          return `
            <div class="market-chip">
              <div class="market-chip__symbol">${s}${isSimulatedPricing ? ' <span title="Precio simulado: sin conexión a la fuente en vivo">⚠</span>' : ''}</div>
              <div class="market-chip__price">$${Number(prices[s]).toLocaleString('es-ES', { maximumFractionDigits: prices[s] < 10 ? 4 : 2 })}</div>
              <div class="market-chip__change" style="color:${change == null ? 'var(--text-dim)' : positive ? 'var(--green)' : 'var(--red)'};">
                ${change == null ? 'Sin histórico todavía' : `${positive ? '+' : ''}${change.toFixed(2)}%`}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        marketEl.innerHTML = `<p class="text-caption">No se ha podido cargar el resumen de mercado.</p>`;
      }
    }

    async function loadLatestAnalysis(contentEl) {
      const el = contentEl.querySelector('[data-latest-analysis]');
      try {
        const { analyses } = await api('/analyzer/history');
        if (!analyses.length) {
          el.innerHTML = `<p class="text-caption" style="margin:0;">Todavía no has analizado ningún gráfico. <a href="/analyzer" style="color:var(--accent); font-weight:700;">Analiza el primero →</a></p>`;
          return;
        }
        const a = analyses[0];
        const sig = SIGNAL_META[a.signal] || SIGNAL_META.WAIT;
        el.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <strong style="font-size:1.0625rem;">${a.asset}</strong>
            <span class="badge badge--${sig.cls}">${vantexIcon(sig.icon, { size: 11 })} ${sig.label}</span>
          </div>
          <p style="margin:0; color:var(--text-dim); font-size:.875rem; line-height:1.5;">${a.mainReason || a.summary || ''}</p>
          <p class="text-caption" style="margin:8px 0 0;">${new Date(a.createdAt).toLocaleString('es-ES')}${a.confidence != null ? ` · ${a.confidence}% de confianza` : ''}</p>
        `;
      } catch (err) {
        el.innerHTML = `<p class="text-caption">No se ha podido cargar tu último análisis.</p>`;
      }
    }

    async function loadScannerPreview(contentEl) {
      const el = contentEl.querySelector('[data-scanner-preview]');
      try {
        const { results, unavailable } = await api('/picks');
        if (unavailable || !results.length) {
          el.innerHTML = `<p class="text-caption" style="margin:0;">Sin datos de mercado en tiempo real ahora mismo — el escáner nunca inventa una lectura.</p>`;
          return;
        }
        el.innerHTML = results.slice(0, 3).map((r) => {
          const sig = SIGNAL_META[r.signal] || SIGNAL_META.WAIT;
          return `
            <div style="display:flex; align-items:center; justify-content:space-between; padding:6px 0;">
              <strong style="font-size:.9375rem;">${r.symbol}</strong>
              <span class="badge badge--${sig.cls}">${vantexIcon(sig.icon, { size: 11 })} ${sig.label} · ${r.confidence}%</span>
            </div>
          `;
        }).join('');
      } catch (err) {
        el.innerHTML = `<p class="text-caption">No se ha podido cargar el escáner.</p>`;
      }
    }

    async function loadOverview(contentEl) {
      const statsEl = contentEl.querySelector('[data-stats]');
      const ctaEl = contentEl.querySelector('[data-cta]');
      try {
        const [trading, history] = await Promise.all([api('/trading'), api('/analyzer/history')]);
        const open = trading.positions.filter((p) => p.status === 'open');
        const openPnl = open.reduce((sum, p) => sum + (p.unrealizedPnl || 0), 0);
        const stats = trading.stats || { totalTrades: 0, winRate: null, totalRealizedPnl: 0 };

        statsEl.innerHTML = `
          <div class="stat-row-cards reveal">
            <div class="stat-card">
              <span class="stat-card__icon" style="background:linear-gradient(135deg, var(--blue), var(--accent));">${vantexIcon('wallet', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">Saldo</span>
                <span class="stat-card__value" data-stat-balance>${fmtUsd(trading.balance)}</span>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon" style="background:${openPnl >= 0 ? 'linear-gradient(135deg, #16a34a, #22c55e)' : 'linear-gradient(135deg, #dc2626, #ef4444)'};">${vantexIcon('trend', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">P&amp;L abierto</span>
                <span class="stat-card__value ${openPnl >= 0 ? 'pnl-pos' : 'pnl-neg'}" data-stat-pnl>${fmtUsd(openPnl)}</span>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon" style="background:linear-gradient(135deg, #8b5cf6, #a855f7);">${vantexIcon('inbox', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">Posiciones abiertas</span>
                <span class="stat-card__value">${open.length}</span>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon" style="background:linear-gradient(135deg, #f59e0b, #f97316);">${vantexIcon('chartBar', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">Win rate (${stats.totalTrades} cerradas)</span>
                <span class="stat-card__value">${stats.winRate == null ? '—' : stats.winRate + '%'}</span>
              </div>
            </div>
          </div>
        `;

        // CTA contextual: guía al usuario hacia la primera acción que le
        // falta en vez de mostrar siempre lo mismo.
        if (history.analyses.length === 0) {
          ctaEl.innerHTML = ctaBanner({
            icon: 'brain', gradient: 'linear-gradient(135deg, var(--accent), var(--blue))',
            title: 'Analiza tu primer gráfico',
            desc: 'Sube la captura de un gráfico y prueba el AI Market Analyzer — es gratis.',
            href: '/analyzer', cta: 'Analizar ahora',
          });
        } else if (open.length === 0) {
          ctaEl.innerHTML = ctaBanner({
            icon: 'chartBar', gradient: 'linear-gradient(135deg, #f97316, #ef4444)',
            title: 'Abre tu primera operación',
            desc: 'Practica con saldo virtual en Paper Trading, sin ningún riesgo real.',
            href: '/trading', cta: 'Abrir operación',
          });
        }
      } catch (err) {
        statsEl.innerHTML = `<p class="text-caption">No se ha podido cargar el resumen: ${err.message}</p>`;
      }
    }

    function ctaBanner({ icon, gradient, title, desc, href, cta }) {
      return `
        <a href="${href}" class="action-card reveal-pop" style="margin-bottom:22px; padding:16px 18px;">
          <div class="action-card__icon" style="background:${gradient}; color:#fff; width:44px; height:44px;">${vantexIcon(icon, { size: 20 })}</div>
          <div style="flex:1; min-width:0;">
            <div class="action-card__title" style="font-size:.9375rem;">${title}</div>
            <div class="action-card__desc">${desc}</div>
          </div>
          <span class="btn-secondary" style="flex-shrink:0;">${cta}</span>
        </a>
      `;
    }
  </script>
</body>
</html>
