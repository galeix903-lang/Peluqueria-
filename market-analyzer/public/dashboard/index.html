<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    mountShell({ page: 'dashboard', title: 'Bienvenido de nuevo 👋' }).then((ctx) => {
      if (!ctx) return;

      // Personaliza el título ahora que ya conocemos al usuario.
      document.querySelector('.topbar h1').textContent = `Bienvenido de nuevo, ${ctx.user.name} 👋`;

      const params = new URLSearchParams(location.search);
      let banner = '';
      if (params.get('upgraded') === 'plus') {
        banner = '<div class="panel reveal-pop" style="margin-bottom:24px; background:var(--green-bg); border-color:var(--green);">🎉 <strong>¡Bienvenido a Vantex Plus!</strong> Ya tienes 15 análisis al día y Copy Trading simulado.</div>';
      } else if (params.get('upgraded')) {
        banner = '<div class="panel reveal-pop" style="margin-bottom:24px; background:var(--green-bg); border-color:var(--green);">🎉 <strong>¡Bienvenido a Vantex Pro!</strong> Ya tienes análisis ilimitados en el AI Analyzer.</div>';
      } else if (params.get('downgraded')) {
        banner = '<div class="panel reveal-pop" style="margin-bottom:24px;">Has vuelto al plan gratuito (3 análisis al día).</div>';
      }
      if (banner) history.replaceState(null, '', location.pathname);

      const statSkeleton = `
        <div class="stat-row-cards">
          ${[0, 1, 2].map(() => `
            <div class="stat-card">
              <div class="skeleton skeleton-avatar" style="border-radius:13px;"></div>
              <div class="stat-card__body" style="flex:1;">
                <div class="skeleton skeleton-text skeleton-text--sm"></div>
                <div class="skeleton skeleton-text" style="width:60%; height:1.5rem;"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      const card = ({ href, icon, gradient, name, title, desc, disabled, delay }) => `
        <${href ? 'a href="' + href + '"' : 'div'} class="feature-card reveal ${disabled ? 'is-disabled' : ''}" style="animation-delay:${delay}s">
          <div class="feature-card__visual">
            <div class="feature-card__pill">
              <div class="feature-card__icon-lg" style="background:${gradient};">${vantexIcon(icon)}</div>
              <div class="feature-card__name">${name}</div>
            </div>
          </div>
          <div class="feature-card__info">
            <div class="feature-card__title">${title}</div>
            <div class="feature-card__desc">${desc}</div>
            ${disabled ? '<span class="badge-soon">Próximamente</span>' : ''}
          </div>
        </${href ? 'a' : 'div'}>
      `;

      ctx.contentEl.innerHTML = `
        ${banner}
        <div data-stats>${statSkeleton}</div>
        <div data-cta></div>
        <div class="primary-group">
          <div class="card-grid">
            ${card({
              href: '/analyzer', icon: 'trend', gradient: 'linear-gradient(135deg, var(--accent), var(--blue))',
              name: 'AI Analyzer', title: 'AI Market Analyzer',
              desc: 'Sube la captura de cualquier gráfico y recibe al instante un análisis técnico generado por IA.',
              delay: 0.02,
            })}
            ${card({
              href: '/trading', icon: 'windowLayout', gradient: 'linear-gradient(135deg, #f97316, #ef4444)',
              name: 'Paper Trading', title: 'Paper Trading',
              desc: 'Opera con dinero virtual y pon a prueba tus estrategias sin ningún riesgo real.',
              delay: 0.08,
            })}
          </div>
        </div>
        <div class="card-grid card-grid--three">
          ${card({
            href: '/picks', icon: 'book', gradient: 'linear-gradient(135deg, #f59e0b, #f97316)',
            name: 'Handpicked Bets', title: 'Handpicked Bets',
            desc: 'Picks frescos generados por IA cada día para ayudarte a decidir.',
            delay: 0.14,
          })}
          ${card({
            href: '/wallet', icon: 'pencil', gradient: 'linear-gradient(135deg, #0ea5e9, #22d3ee)',
            name: 'Wallet Tracker', title: 'Wallet Tracker',
            desc: 'Sigue direcciones y observa sus holdings y actividad (modo simulado).',
            delay: 0.2,
          })}
          ${card({
            href: '/copy', icon: 'sparkle', gradient: 'linear-gradient(135deg, #8b5cf6, #a855f7)',
            name: 'Copy Trading', title: 'Copy Trading',
            desc: 'Sigue a traders modelo y replica sus operaciones (simulado, sin fondos reales).',
            delay: 0.26,
          })}
        </div>
      `;

      loadOverview(ctx.contentEl);
    });

    async function loadOverview(contentEl) {
      const statsEl = contentEl.querySelector('[data-stats]');
      const ctaEl = contentEl.querySelector('[data-cta]');
      try {
        const [trading, history] = await Promise.all([api('/trading'), api('/analyzer/history')]);
        const open = trading.positions.filter((p) => p.status === 'open');
        const openPnl = open.reduce((sum, p) => sum + (p.unrealizedPnl || 0), 0);

        statsEl.innerHTML = `
          <div class="stat-row-cards reveal">
            <div class="stat-card">
              <span class="stat-card__icon" style="background:linear-gradient(135deg, var(--blue), var(--accent));">${vantexIcon('wallet', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">Saldo</span>
                <span class="stat-card__value" data-stat-balance>${fmtUsd(trading.balance)}</span>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon" style="background:${openPnl >= 0 ? 'linear-gradient(135deg, #16a34a, #22c55e)' : 'linear-gradient(135deg, #dc2626, #ef4444)'};">${vantexIcon('trend', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">P&amp;L abierto</span>
                <span class="stat-card__value ${openPnl >= 0 ? 'pnl-pos' : 'pnl-neg'}" data-stat-pnl>${fmtUsd(openPnl)}</span>
              </div>
            </div>
            <div class="stat-card">
              <span class="stat-card__icon" style="background:linear-gradient(135deg, #8b5cf6, #a855f7);">${vantexIcon('inbox', { size: 21 })}</span>
              <div class="stat-card__body">
                <span class="stat-card__label text-meta">Posiciones abiertas</span>
                <span class="stat-card__value">${open.length}</span>
              </div>
            </div>
          </div>
        `;

        // CTA contextual: guía al usuario hacia la primera acción que le
        // falta en vez de mostrar siempre lo mismo.
        if (history.analyses.length === 0) {
          ctaEl.innerHTML = ctaBanner({
            icon: 'brain', gradient: 'linear-gradient(135deg, var(--accent), var(--blue))',
            title: 'Analiza tu primer gráfico',
            desc: 'Sube la captura de un gráfico y prueba el AI Market Analyzer — es gratis.',
            href: '/analyzer', cta: 'Analizar ahora',
          });
        } else if (open.length === 0) {
          ctaEl.innerHTML = ctaBanner({
            icon: 'chartBar', gradient: 'linear-gradient(135deg, #f97316, #ef4444)',
            title: 'Abre tu primera operación',
            desc: 'Practica con saldo virtual en Paper Trading, sin ningún riesgo real.',
            href: '/trading', cta: 'Abrir operación',
          });
        }
      } catch (err) {
        statsEl.innerHTML = `<p class="text-caption">No se ha podido cargar el resumen: ${err.message}</p>`;
      }
    }

    function ctaBanner({ icon, gradient, title, desc, href, cta }) {
      return `
        <a href="${href}" class="action-card reveal-pop" style="margin-bottom:22px; padding:16px 18px;">
          <div class="action-card__icon" style="background:${gradient}; color:#fff; width:44px; height:44px;">${vantexIcon(icon, { size: 20 })}</div>
          <div style="flex:1; min-width:0;">
            <div class="action-card__title" style="font-size:.9375rem;">${title}</div>
            <div class="action-card__desc">${desc}</div>
          </div>
          <span class="btn-secondary" style="flex-shrink:0;">${cta}</span>
        </a>
      `;
    }
  </script>
</body>
</html>
