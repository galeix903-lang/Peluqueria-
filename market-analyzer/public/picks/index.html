<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — Handpicked Bets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .pick-card { padding: 18px 0; border-top: 1px solid var(--border); animation: fadeInUp .45s cubic-bezier(.16,.84,.44,1) both; transition: background .15s; }
  .pick-card:first-child { border-top: none; padding-top: 0; }
  .pick-card:hover { background: var(--field-bg); border-radius: 10px; }
  .pick-card__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    mountShell({ page: 'picks', title: 'Handpicked Bets' }).then(async (ctx) => {
      if (!ctx) return;
      ctx.contentEl.innerHTML = `
        <div class="panel reveal" data-picks-list>
          <div class="empty-state">
            <div class="empty-state__icon"><span class="spinner" style="border-color:var(--accent-dim); border-top-color:var(--accent); width:20px; height:20px;"></span></div>
            Cargando picks…
          </div>
        </div>
      `;
      const listEl = ctx.contentEl.querySelector('[data-picks-list]');
      try {
        const { picks } = await api('/picks');
        if (!picks.length) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">${vantexIcon('star', { size: 26 })}</div>
              Todavía no hay picks disponibles.
            </div>
          `;
          return;
        }
        listEl.innerHTML = picks.map((p, i) => `
          <div class="pick-card" style="animation-delay:${i * 0.06}s">
            <div class="pick-card__head">
              <strong>${p.symbol}</strong>
              <span style="color:var(--text-dim); font-size:.8125rem;">${new Date(p.createdAt).toLocaleDateString('es-ES')}</span>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <span class="badge badge--${p.trend}">${p.trend}</span>
              <span class="badge badge--${p.bias}">${p.bias}</span>
              ${p.mock ? '<span class="badge badge--mock">Modo de ejemplo</span>' : ''}
              <span class="badge" style="background:var(--field-bg); color:var(--text-dim);">Confianza ${p.confidence}%</span>
            </div>
            <p style="margin:0; line-height:1.5;">${p.summary}</p>
            <p class="disclaimer">${p.disclaimer}</p>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<p class="empty-state">${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
