<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vantex — Market Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/shared/style.css" />
<style>
  .scan-card { padding: 18px 0; border-top: 1px solid var(--border); animation: fadeInUp .45s cubic-bezier(.16,.84,.44,1) both; transition: background .15s; }
  .scan-card:first-child { border-top: none; padding-top: 0; }
  .scan-card:hover { background: var(--field-bg); border-radius: 10px; }
  .scan-card__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .scan-card__signal { display: flex; align-items: center; gap: 6px; font-weight: 800; }
  .scan-card__signal svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div data-app-shell></div>

  <script src="/shared/api.js"></script>
  <script src="/shared/icons.js"></script>
  <script src="/shared/format.js"></script>
  <script src="/shared/modal.js"></script>
  <script src="/shared/toast.js"></script>
  <script src="/shared/sidebar.js"></script>
  <script>
    const SIGNAL_META = {
      BUY: { icon: 'arrowUp', label: 'Sesgo alcista', cls: 'buy' },
      SELL: { icon: 'arrowDown', label: 'Sesgo bajista', cls: 'sell' },
      WAIT: { icon: 'arrowRight', label: 'Neutral', cls: 'wait' },
    };
    const TREND_LABEL = { BULLISH: 'Alcista', BEARISH: 'Bajista', SIDEWAYS: 'Lateral' };
    const RISK_LABEL = { LOW: 'Bajo', MEDIUM: 'Medio', HIGH: 'Alto' };

    mountShell({ page: 'picks', title: 'Market Scanner' }).then(async (ctx) => {
      if (!ctx) return;
      ctx.contentEl.innerHTML = `
        <div class="panel reveal" style="margin-bottom:18px;">
          <div class="analyzer-head">
            <div class="analyzer-head__icon">${vantexIcon('search', { size: 22 })}</div>
            <div>
              <div class="text-h3">Market Scanner</div>
              <div class="text-caption">Escaneo en vivo de los activos con datos de mercado reales — el mismo motor determinista del AI Analyzer, sin intervención de un LLM.</div>
            </div>
          </div>
        </div>
        <div class="panel reveal" data-scan-list>
          <div class="empty-state">
            <div class="empty-state__icon"><span class="spinner" style="border-color:var(--accent-dim); border-top-color:var(--accent); width:20px; height:20px;"></span></div>
            Escaneando el mercado…
          </div>
        </div>
      `;
      const listEl = ctx.contentEl.querySelector('[data-scan-list]');
      try {
        const { results, unavailable, updatedAt } = await api('/picks');
        if (unavailable || !results.length) {
          listEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">${vantexIcon('alertTriangle', { size: 26 })}</div>
              No se han podido obtener datos de mercado en tiempo real en este momento. El escáner nunca muestra una lectura inventada — inténtalo de nuevo en unos minutos.
            </div>
          `;
          return;
        }
        listEl.innerHTML = `
          <p class="text-caption" style="margin:0 0 14px;">Actualizado ${new Date(updatedAt).toLocaleTimeString('es-ES')}</p>
          ${results.map((r, i) => {
            const sig = SIGNAL_META[r.signal] || SIGNAL_META.WAIT;
            return `
            <a href="/analyzer" class="scan-card" style="display:block; text-decoration:none; color:inherit; animation-delay:${i * 0.06}s">
              <div class="scan-card__head">
                <strong style="font-size:1rem;">${r.symbol}</strong>
                <span class="scan-card__signal badge badge--${sig.cls}">${vantexIcon(sig.icon, { size: 13 })}${sig.label}</span>
              </div>
              <div style="display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;">
                <span class="badge" style="background:var(--field-bg); color:var(--text-dim);">${TREND_LABEL[r.trend] || r.trend}</span>
                <span class="badge" style="background:var(--field-bg); color:var(--text-dim);">Confianza ${r.confidence}%</span>
                <span class="badge badge--${(r.risk || 'medium').toLowerCase()}">Riesgo ${RISK_LABEL[r.risk] || r.risk}</span>
                ${r.price ? `<span class="badge" style="background:var(--field-bg); color:var(--text-dim);">$${Number(r.price).toLocaleString('es-ES', { maximumFractionDigits: 2 })}</span>` : ''}
              </div>
              <p style="margin:0; line-height:1.5; color:var(--text-dim);">${r.mainReason}</p>
            </a>
          `;
          }).join('')}
        `;
      } catch (err) {
        listEl.innerHTML = `<p class="empty-state">${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
