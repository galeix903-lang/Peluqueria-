# Blueprint de Render (https://render.com) para desplegar Vantex desde
# este monorepo. En Render: "New +" -> "Blueprint" -> conecta este
# repositorio de GitHub -> Render detecta este fichero solo.
#
# Nota sobre persistencia: el plan gratuito de Render no incluye disco
# persistente, así que data/db.json se reinicia en cada redeploy o cuando
# el servicio "duerme" por inactividad y vuelve a arrancar. Vale para
# probar y enseñar la app; si quieres que las cuentas/operaciones
# sobrevivan a los redeploys, el siguiente paso natural es un disco de
# pago en Render o migrar server/store.js a una base de datos real
# (ver la sección "Fase 2" de PLAN.md).
services:
  - type: web
    name: vantex
    runtime: node
    plan: free
    rootDir: market-analyzer
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ANALYZER_MODE
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BILLING_MODE
        value: auto
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_PLUS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
