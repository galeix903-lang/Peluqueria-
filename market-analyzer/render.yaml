# Blueprint de Render (https://render.com) para desplegar Cryptolyzer desde
# este monorepo. En Render: "New +" -> "Blueprint" -> conecta este
# repositorio de GitHub -> Render detecta este fichero solo.
#
# Base de datos: Postgres gestionado por Render (databases, abajo),
# DATABASE_URL se rellena solo (fromDatabase). El plan "free" de Postgres
# en Render caduca a los 30 días si no se pasa a uno de pago — para un
# uso real conviene revisarlo en el dashboard antes de esa fecha.
#
# OJO al renombrar de Vantex a Cryptolyzer: el servicio y la base de datos
# de abajo YA EXISTEN en Render con el nombre "vantex"/"vantex-db".
# Render identifica los recursos de un Blueprint por este campo `name`,
# así que cambiarlo aquí y hacer push NO renombra el servicio real — crea
# uno nuevo vacío (sin las claves de Stripe ni los secretos ya
# configurados) y deja el antiguo huérfano. Para renombrar el servicio
# que ya está desplegado, hazlo desde el dashboard de Render (el propio
# servicio -> Settings -> Name) — eso sí cambia también la URL
# *.onrender.com. Solo después de hacerlo ahí, actualiza estos `name:`
# para que vuelvan a coincidir con la realidad.
databases:
  - name: vantex-db
    plan: free

services:
  - type: web
    name: vantex
    runtime: node
    plan: free
    rootDir: market-analyzer
    buildCommand: npm install
    startCommand: npm start
    # Render usa esto para saber si el despliegue está realmente listo
    # (y para reiniciar el servicio solo si deja de responder bien) —
    # sin esto, un arranque roto podía quedar marcado como "live" solo
    # porque el proceso respondía a cualquier URL.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vantex-db
          property: connectionString
      # Explícito en vez de confiar en que Render lo ponga por defecto:
      # de esto depende que la cookie de sesión lleve el flag Secure
      # (ver server/index.js, configuración de express-session).
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ANALYZER_MODE
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BILLING_MODE
        value: auto
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_PLUS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
