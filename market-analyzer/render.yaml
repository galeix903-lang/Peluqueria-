# Blueprint de Render (https://render.com) para desplegar Vantex desde
# este monorepo. En Render: "New +" -> "Blueprint" -> conecta este
# repositorio de GitHub -> Render detecta este fichero solo.
#
# Base de datos: Postgres gestionado por Render (databases, abajo),
# DATABASE_URL se rellena solo (fromDatabase). El plan "free" de Postgres
# en Render caduca a los 30 días si no se pasa a uno de pago — para un
# uso real conviene revisarlo en el dashboard antes de esa fecha.
databases:
  - name: vantex-db
    plan: free

services:
  - type: web
    name: vantex
    runtime: node
    plan: free
    rootDir: market-analyzer
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vantex-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ANALYZER_MODE
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BILLING_MODE
        value: auto
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_PLUS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
